<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Requested voice corrections</title>
<style>body{background:#101722;color:#e8eef8;font:16px system-ui;margin:32px auto;padding:0 20px;max-width:1150px}p{color:#bbc9db;line-height:1.6}section{padding:18px;background:#192436;border-radius:12px;margin:14px 0}.parts{display:flex;gap:10px;flex-wrap:wrap}button,a{color:#e8eef8}button{cursor:pointer;background:#294568;border:1px solid #6583ab;border-radius:8px;padding:14px}button.active{background:#486da0}small{display:block;margin-top:6px;color:#c5d3e8}header{display:flex;align-items:center;gap:20px;margin-bottom:14px}header button{background:#27313e;padding:8px}input{padding:12px;border-radius:8px}#status{position:sticky;top:0;background:#101722;padding:12px}</style>
<h1>Latest requested corrections</h1><p>Only the latest flagged clips. Approved files are unchanged. Source-recovery clips include extra original context and need boundary review; no speech was synthesized. Game pool unchanged.</p><p id="count"></p><input id="filter" placeholder="Find original clip number"><button id="stop">Stop audio</button><div id="status">Ready</div><main id="board"></main><script>
const items=[{"number": "482-part-1a-1", "original": "clips/482-part-1a-1.mp3", "duration": 0.97, "parts": [{"label": "482-part-1a-1 \u00e2\u20ac\u201d new split; review", "file": "clips/482-part-1a-1.mp3", "duration": 0.97}]}, {"number": "482-part-1a-2", "original": "clips/482-part-1a-2.mp3", "duration": 1.15, "parts": [{"label": "482-part-1a-2 \u00e2\u20ac\u201d new split; review", "file": "clips/482-part-1a-2.mp3", "duration": 1.15}]}, {"number": "482-part-3a", "original": "clips/482-part-3a.mp3", "duration": 1.355, "parts": [{"label": "482-part-3a \u00e2\u20ac\u201d ending fragment removed; review", "file": "clips/482-part-3a.mp3", "duration": 1.355}]}, {"number": "482-part-4a+4b", "original": "clips/482-part-4a_4b.mp3", "duration": 1.7277083333333334, "parts": [{"label": "482-part-4a+4b \u00e2\u20ac\u201d rejoined", "file": "clips/482-part-4a_4b.mp3", "duration": 1.7277083333333334}]}, {"number": "488+489", "original": "clips/488_489.mp3", "duration": 1.3866666666666667, "parts": [{"label": "488+489 \u00e2\u20ac\u201d rejoined including transferred tail", "file": "clips/488_489.mp3", "duration": 1.3866666666666667}]}, {"number": "586-1", "original": "clips/586-1.mp3", "duration": 0.99, "parts": [{"label": "586-1 \u00e2\u20ac\u201d tail transferred to part 2", "file": "clips/586-1.mp3", "duration": 0.99}]}, {"number": "586-2", "original": "clips/586-2.mp3", "duration": 1.3751666666666666, "parts": [{"label": "586-2 \u00e2\u20ac\u201d includes missing start from part 1", "file": "clips/586-2.mp3", "duration": 1.3751666666666666}]}, {"number": "596+598", "original": "clips/596_598.mp3", "duration": 1.75, "parts": [{"label": "596+598 \u00e2\u20ac\u201d ending fragment removed; review", "file": "clips/596_598.mp3", "duration": 1.75}]}, {"number": "512-part-4", "original": "clips/512-part-4.mp3", "duration": 1.015, "parts": [{"label": "512-part-4 \u00e2\u20ac\u201d ending fragment removed; review", "file": "clips/512-part-4.mp3", "duration": 1.015}]}, {"number": "549", "original": "clips/549.mp3", "duration": 0.87, "parts": [{"label": "549 \u00e2\u20ac\u201d ending fragment removed; review", "file": "clips/549.mp3", "duration": 0.87}]}, {"number": "572-source-recovery", "original": "clips/572-source-recovery.mp3", "duration": 0.9398333333333333, "parts": [{"label": "572-source-recovery \u00e2\u20ac\u201d source context restored; review boundary", "file": "clips/572-source-recovery.mp3", "duration": 0.9398333333333333}]}, {"number": "605-source-recovery", "original": "clips/605-source-recovery.mp3", "duration": 1.047, "parts": [{"label": "605-source-recovery \u00e2\u20ac\u201d source context restored; review boundary", "file": "clips/605-source-recovery.mp3", "duration": 1.047}]}];let audio,active;const board=document.querySelector('#board');document.querySelector('#count').textContent=items.reduce((n,x)=>n+x.parts.length,0)+' correction candidates';
function play(file,button,label){audio?.pause();active?.classList.remove('active');audio=new Audio(file);active=button;button.classList.add('active');document.querySelector('#status').textContent='Playing '+label;audio.onended=()=>button.classList.remove('active');audio.play().catch(e=>document.querySelector('#status').textContent=e.message)}
for(const item of items){const s=document.createElement('section');s.dataset.number=String(item.number);const h=document.createElement('header');h.innerHTML='<b>Correction '+item.number+'</b>';const original=document.createElement('button');original.textContent='Play correction Â· '+item.duration.toFixed(2)+'s';original.onclick=()=>play(item.original,original,'original '+item.number);h.append(original);s.append(h);const row=document.createElement('div');row.className='parts';for(const p of item.parts){const b=document.createElement('button');b.innerHTML=p.label+'<small>'+p.duration.toFixed(2)+' seconds</small>';b.onclick=()=>play(p.file,b,p.label);row.append(b)}s.append(row);board.append(s)}
document.querySelector('#stop').onclick=()=>{audio?.pause();active?.classList.remove('active');document.querySelector('#status').textContent='Stopped'};document.querySelector('#filter').oninput=e=>{for(const s of board.children)s.hidden=!s.dataset.number.includes(e.target.value.trim())};</script></html>

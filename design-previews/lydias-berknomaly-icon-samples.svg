<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#182132"/>
      <stop offset="1" stop-color="#06080e"/>
    </radialGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#141b29"/>
      <stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <style>
      .title{font-family:Georgia,serif;font-size:34px;font-weight:700;letter-spacing:5px;fill:#f3dc8a}
      .sub{font-family:Arial,sans-serif;font-size:15px;letter-spacing:2px;fill:#9fafc6}
      .label{font-family:Georgia,serif;font-size:18px;font-weight:700;fill:#f5eab5}
      .note{font-family:Arial,sans-serif;font-size:13px;fill:#8fa1b9}
      .tile{fill:url(#card);stroke:#d8b64a;stroke-opacity:.32;stroke-width:1.5}
      .ring{fill:#07101c;stroke:#e5c34f;stroke-width:2.4}
      .inner{fill:#0b1320;stroke:rgba(255,255,255,.18);stroke-width:1}
      .num{font-family:Georgia,serif;font-size:21px;font-weight:700;fill:#f9e89c}
      .thin{fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1280" height="620" fill="url(#bg)"/>
  <path d="M0 84H1280" stroke="#d8b64a" stroke-opacity=".35"/>
  <text class="title" x="640" y="48" text-anchor="middle">LYDIA'S BERKNOMALY</text>
  <text class="sub" x="640" y="72" text-anchor="middle">ABSTRACT STATUS ICON SAMPLES</text>

  <!-- 1 -->
  <g transform="translate(64 114)" filter="url(#shadow)">
    <rect class="tile" width="204" height="204" rx="12"/>
    <circle class="ring" cx="102" cy="89" r="58"/>
    <circle class="inner" cx="102" cy="89" r="45"/>
    <path class="thin" d="M70 95C82 64 117 53 137 74C150 88 143 111 121 120C96 130 72 119 70 95Z" stroke="#7ed7ff" stroke-width="8" filter="url(#softGlow)"/>
    <path class="thin" d="M92 61L112 118M130 70L78 111" stroke="#f4d663" stroke-width="5"/>
    <circle cx="102" cy="89" r="8" fill="#fff6bd"/>
    <text class="num" x="18" y="31">1</text>
    <text class="label" x="102" y="170" text-anchor="middle">Folded Orbit</text>
    <text class="note" x="102" y="189" text-anchor="middle">looped anomaly mark</text>
  </g>


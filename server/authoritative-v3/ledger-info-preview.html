<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><title>Ledger Archive UI verification</title>
<link rel="stylesheet" href="src/styles/game.css"><link rel="stylesheet" href="src/styles/zz-codex-last.css"><link rel="stylesheet" href="src/styles/ledger-archive.css">
<style>body{background:#0b121a;color:#edf6f6;padding:32px;font-family:system-ui}#result{white-space:pre-wrap}</style></head><body>
<h1>Ledger Archive verification</h1><button id="open">Open reorder window</button><pre id="result">No order submitted.</pre>
<script>function getHandCardEffectModifiers(card){return card.id==='75'?[{name:'Smart Investments',text:'Smart Investments: this card permanently gained 2 Fate.'}]:[];}function escapePlacementAnimHtml(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;');}
function buildHandEffectMarkerHTML(card, extraClass) {
  const rows = typeof getHandCardEffectModifiers === 'function' ? getHandCardEffectModifiers(card) : [];
  if(!rows.length) return '';
  const markerClass = ['hand-effect-marker', String(extraClass || '').trim()].filter(Boolean).join(' ');
  return '<div class="' + markerClass + '" role="button" tabindex="0" aria-label="Card effect modifiers" onclick="event.preventDefault();event.stopPropagation();showHandEffectTooltip(event);positionHandEffectTooltip(event);" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();event.stopPropagation();showHandEffectTooltip(event);positionHandEffectTooltip(event);}" onmouseenter="showHandEffectTooltip(event)" onmousemove="positionHandEffectTooltip(event)" onmouseleave="hideHandEffectTooltip()">' +
    '<span class="hand-effect-marker-icon" aria-hidden="true">i</span>' +
    '<div class="hand-effect-tooltip">' +
      rows.map(function(row){
        return '<div class="hand-effect-row">' +
          '<div class="hand-effect-name">' + escapePlacementAnimHtml(row.name || 'Effect') + '</div>' +
          '<div class="hand-effect-text">' + escapePlacementAnimHtml(row.text || 'Card modified.') + '</div>' +
        '</div>';
      }).join('') +
    '</div>' +
  '</div>';
}

let _handEffectTooltipPortal = null;
function getHandEffectTooltipPortal() {
  if(_handEffectTooltipPortal && _handEffectTooltipPortal.isConnected) return _handEffectTooltipPortal;
  _handEffectTooltipPortal = document.createElement('div');
  _handEffectTooltipPortal.className = 'hand-effect-tooltip hand-effect-tooltip-portal';
  document.body.appendChild(_handEffectTooltipPortal);
  return _handEffectTooltipPortal;
}

function resolveHandEffectMarker(ev, explicitMarker) {
  if(explicitMarker && explicitMarker.classList?.contains('hand-effect-marker')) return explicitMarker;
  const current = ev && ev.currentTarget instanceof Element ? ev.currentTarget : null;
  if(current?.classList?.contains('hand-effect-marker')) return current;
  const target = ev && ev.target instanceof Element ? ev.target : null;
  return target?.closest?.('.hand-effect-marker') || null;
}

function positionHandEffectTooltip(ev, explicitMarker) {
  if(!_handEffectTooltipPortal || !_handEffectTooltipPortal.isConnected) return;
  const marker = resolveHandEffectMarker(ev, explicitMarker);
  const pickerMarker = !!(marker && marker.classList && marker.classList.contains('picker-effect-marker'));
  const deckPickerMarker = pickerMarker && !marker.classList.contains('hand-limit-picker-effect-marker');
  const card = marker && marker.closest
    ? marker.closest(pickerMarker ? '.visual-mc,.board-target-card,.hand-limit-card,.ledger-card' : '.hc')
    : null;
  let rect = card && card.getBoundingClientRect ? card.getBoundingClientRect() : null;
  if(!rect && pickerMarker && marker?.classList?.contains('canvas-picker-effect-marker')){
    const layer = marker.parentElement;
    const layerRect = layer && layer.getBoundingClientRect ? layer.getBoundingClientRect() : null;
    const leftRatio = Number(marker.dataset.pickerCardLeftRatio);
    const topRatio = Number(marker.dataset.pickerCardTopRatio);
    const widthRatio = Number(marker.dataset.pickerCardWidthRatio);
    const heightRatio = Number(marker.dataset.pickerCardHeightRatio);
    if(layerRect && [leftRatio, topRatio, widthRatio, heightRatio].every(Number.isFinite)){
      const left = layerRect.left + layerRect.width * leftRatio;
      const top = layerRect.top + layerRect.height * topRatio;
      const width = layerRect.width * widthRatio;
      const height = layerRect.height * heightRatio;
      rect = {left:left, top:top, width:width, height:height, right:left + width, bottom:top + height};
    }
  }
  if(!rect) rect = marker && marker.getBoundingClientRect ? marker.getBoundingClientRect() : null;
  if(!rect) return;
  const width = Math.min(300, Math.max(240, window.innerWidth - 32));
  const gap = 24;
  const estimatedHeight = Math.min(170, Math.max(96, _handEffectTooltipPortal.offsetHeight || 118));
  let x;
  let y;
  if(pickerMarker){
    // Picker cards live in a centered modal (and canvas cards only have a DOM
    // marker). Anchor the tooltip directly above that card/marker instead of
    // using the hand's left-side placement, which collapsed it into the
    // screen's top-left corner.
    x = rect.left + rect.width / 2 - width / 2;
    y = rect.top - estimatedHeight - 10;
    if(y < 12) y = rect.bottom + 10;
    // Deck/search pickers sit higher than hand discard panels. Keep their
    // information panel close to the card without changing hand placement.
    y += deckPickerMarker ? 24 : 12;
  }else{
    x = rect.left - width - gap;
    if(x < 12) x = Math.max(12, rect.left - Math.min(220, width - 40));
    y = rect.top + Math.min(12, rect.height * .12) + 67;
  }
  x = Math.max(12, Math.min(x, window.innerWidth - width - 12));
  if(y + estimatedHeight > window.innerHeight - 12) y = window.innerHeight - estimatedHeight - 12;
  if(y < 12) y = 12;
  _handEffectTooltipPortal.style.setProperty('width', width + 'px', 'important');
  _handEffectTooltipPortal.style.setProperty('left', Math.round(x) + 'px', 'important');
  _handEffectTooltipPortal.style.setProperty('top', Math.round(y) + 'px', 'important');
}

function showHandEffectTooltip(ev, explicitMarker) {
  const marker = resolveHandEffectMarker(ev, explicitMarker);
  const source = marker && marker.querySelector ? marker.querySelector('.hand-effect-tooltip') : null;
  if(!source) return;
  if(marker.classList?.contains('picker-effect-marker') && typeof removeHoverPreview === 'function') removeHoverPreview();
  const portal = getHandEffectTooltipPortal();
  if(marker.closest?.('#ledger-archive')) portal.style.setProperty('z-index','2147483001','important');
  else portal.style.removeProperty('z-index');
  portal.innerHTML = source.innerHTML;
  portal.classList.add('is-visible');
  positionHandEffectTooltip(ev, marker);
}

function hideHandEffectTooltip() {
  if(!_handEffectTooltipPortal) return;
  _handEffectTooltipPortal.classList.remove('is-visible');
}

function bindPickerEffectMarker(marker) {
  if(!marker || marker.dataset?.pickerTooltipBound === 'true') return;
  if(marker.closest?.('.board-target-picker,.board-target-picker-modal,.zone-picker-wrap')) return;
  marker.dataset.pickerTooltipBound = 'true';
  marker.addEventListener('pointerenter', function(ev){
    showHandEffectTooltip(ev, marker);
    positionHandEffectTooltip(ev, marker);
  });
  marker.addEventListener('pointermove', function(ev){ positionHandEffectTooltip(ev, marker); });
  marker.addEventListener('pointerleave', function(){ hideHandEffectTooltip(); });
  marker.addEventListener('focus', function(ev){ showHandEffectTooltip(ev, marker); }, true);
  marker.addEventListener('blur', function(){ hideHandEffectTooltip(); }, true);
}

function bindPickerEffectMarkers(root) {
  const scope = root && root.querySelectorAll ? root : document;
  scope.querySelectorAll('.picker-effect-marker').forEach(bindPickerEffectMarker);
}
window.bindPickerEffectMarkers = bindPickerEffectMarkers;</script><script src="src/scripts/51-ledger-archive.js"></script>
<script>
const samples = [{id:'75',name:'The Ledger-keepers',img:'75.png?v=20260907-ledger2'},{id:'42',name:'West German Soldier',img:'42.png'},{id:'01',name:'Felicyta Janowicz',img:'1.png'},{id:'29',name:'Dylan Kirby',img:'29.png'},{id:'38',name:'Jake',img:'38.png'}].map((card,index)=>({...card,iid:'card-'+index}));
document.getElementById('open').onclick = ()=>openLedgerArchive(samples,{key:'verification',onConfirm:ordered=>{document.getElementById('result').textContent='Saved draw order:\n'+ordered.map((card,i)=>(i+1)+'. '+card.name).join('\n');return true;}});
document.getElementById('open').click();
</script></body></html>

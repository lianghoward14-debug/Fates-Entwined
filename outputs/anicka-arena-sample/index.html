<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anička · The Starlit Path</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09191f;color:#e3f4ed;font:15px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:29px;margin:6px 0}small{color:#85b5b7;letter-spacing:2px}p{color:#a5c5c5;line-height:1.5}canvas{display:block;width:100%;background:#0d252c;border:1px solid #24454b;border-radius:14px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button{background:#17363e;color:#d8eee8;border:1px solid #42626a;border-radius:8px;padding:13px 17px;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#a4e2d4;color:#0c272e}button:focus-visible{outline:3px solid #fff}#detail{min-height:44px}label{display:flex;align-items:center;gap:8px}footer{font-size:12px;color:#82a5ad}@media(max-width:500px){main{padding:14px}header{display:block}h1{font-size:24px}}
</style><main><header><div><small>CHARACTER 02 / ANIMATION STUDY</small><h1>Anička Konvička</h1><p>The Starlit Path · four proposed arena abilities</p></div><label><input id="auto" type="checkbox" checked> Auto showcase</label></header>
<canvas id="stage" width="960" height="480" role="img" aria-label="Animated Anička sprite performing four abilities on a training arena"></canvas>
<nav aria-label="Animation"><button data-mode="0">Idle</button><button data-mode="1">Q · Starbolt</button><button data-mode="2">W · Starlit Dash</button><button data-mode="3">E · Safe Harbour</button><button data-mode="4">R · Constellation Burst</button><button id="pause">Pause</button></nav><p id="detail" aria-live="polite"></p><footer>Prototype · generated character poses + real-time effects · one facing direction · no multiplayer or combat simulation</footer></main>
<script>
(()=>{const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d'),img=new Image(),buttons=[...document.querySelectorAll('[data-mode]')],auto=document.getElementById('auto'),detail=document.getElementById('detail');
const labels=['Idle · breathing and ponytail motion.','Starbolt · a focused starlight projectile.','Starlit Dash · a quick advance leaving a luminous wake.','Safe Harbour · a protective circle inspired by her extra safe row.','Constellation Burst · a charged radial release of starlight.'];let mode=0,time=0,last=0,paused=false,cycle=0;
function choose(n){mode=n;time=0;detail.textContent=labels[n];buttons.forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.mode===n)))}buttons.forEach(b=>b.onclick=()=>{auto.checked=false;choose(+b.dataset.mode)});document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};
function star(x,y,r,a=1){ctx.save();ctx.translate(x,y);ctx.globalAlpha=a;ctx.fillStyle='#d6fff2';ctx.shadowColor='#6cffee';ctx.shadowBlur=18;ctx.beginPath();for(let i=0;i<8;i++){let r2=i%2?r*.28:r,angle=i*Math.PI/4;ctx.lineTo(Math.cos(angle)*r2,Math.sin(angle)*r2)}ctx.closePath();ctx.fill();ctx.restore()}
function ring(x,y,r,a=1,flat=.5){ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='#88e9dd';ctx.lineWidth=3;ctx.shadowColor='#5ef2de';ctx.shadowBlur=15;ctx.beginPath();ctx.ellipse(x,y,r,r*flat,0,0,Math.PI*2);ctx.stroke();ctx.restore()}
function sprite(row,frame,x,y,alpha=1){ctx.save();ctx.globalAlpha=alpha;let sw=img.width/4,sh=img.height/5;ctx.drawImage(img,frame*sw,row*sh,sw,sh,x-100,y-190,200,200);ctx.restore()}
function draw(dt){time+=dt;let duration=2.6;if(auto.checked&&time>duration){cycle=(cycle+1)%5;choose(cycle)}let t=time%duration,p=Math.max(0,Math.min(1,(t-.5)/1.25)),x=mode===2?310+270*(p*p*(3-2*p)):390,y=330;
ctx.clearRect(0,0,960,480);let bg=ctx.createRadialGradient(480,260,20,480,250,560);bg.addColorStop(0,'#24444b');bg.addColorStop(1,'#091c24');ctx.fillStyle=bg;ctx.fillRect(0,0,960,480);ctx.strokeStyle='#315059';ctx.lineWidth=1;for(let i=-500;i<1400;i+=85){ctx.beginPath();ctx.moveTo(i,100);ctx.lineTo(i+350,480);ctx.stroke();ctx.beginPath();ctx.moveTo(i,480);ctx.lineTo(i+350,100);ctx.stroke()}ctx.fillStyle='#9ab9bb';ctx.font='13px system-ui';ctx.fillText('TRAINING GROUND',28,35);ctx.fillText('POSES + EFFECTS PREVIEW',28,455);
ring(480,320,320,.25,.36);ctx.fillStyle='#071c23';ctx.beginPath();ctx.ellipse(x,y-3,44,13,0,0,7);ctx.fill();
// Target pillar.
ctx.fillStyle='#49606a';ctx.fillRect(755,232,26,90);ctx.fillStyle='#79929a';ctx.beginPath();ctx.arc(768,224,25,0,7);ctx.fill();ctx.strokeStyle='#b4c5c7';ctx.lineWidth=3;ctx.beginPath();ctx.arc(768,224,13,0,7);ctx.stroke();
let active=t<1.9,row=active?mode:0,frame=row?Math.min(3,Math.floor(t/1.9*4)):Math.floor(time*4)%4;
if(mode===3&&active){ring(x,y,80+20*Math.sin(p*Math.PI),Math.sin(p*Math.PI));ctx.save();ctx.globalAlpha=Math.sin(p*Math.PI)*.18;ctx.fillStyle='#81e7d4';ctx.beginPath();ctx.ellipse(x,y-60,95,105,0,0,7);ctx.fill();ctx.restore()}
if(mode===2&&p>0&&p<1){for(let i=4;i>0;i--)sprite(row,frame,x-i*32,y,.09*(5-i));for(let i=0;i<12;i++)star(x-20-i*19,y-30+Math.sin(i*3)*22,4,(1-p)*.8)}
sprite(row,frame,x,y+(row===0?Math.sin(time*4)*2:0));
if(mode===1&&t>.5&&t<1.9){let q=Math.min(1,(t-.5)/.9),sx=x+55+(768-x-55)*q,sy=y-95;for(let i=8;i>0;i--)star(sx-i*9,sy,Math.max(2,10-i),.5-i*.05);star(sx,sy,17);if(q===1){ring(768,sy,20+45*((t-1.4)/.5),Math.max(0,1-(t-1.4)/.5),1);for(let i=0;i<8;i++){let a=i*Math.PI/4;star(768+Math.cos(a)*(t-1.4)*100,sy+Math.sin(a)*(t-1.4)*100,5)}}}
if(mode===3&&active)for(let i=0;i<7;i++){let a=i*Math.PI*2/7+time;star(x+Math.cos(a)*95,y+Math.sin(a)*35,7,Math.sin(p*Math.PI))}
if(mode===4&&active){let charge=Math.min(1,t/.95);if(t<1){for(let i=0;i<6;i++){let a=i*Math.PI/3-time*2,r=70*(1-charge)+15;star(x+Math.cos(a)*r,y-140+Math.sin(a)*r,7)}star(x,y-140,12+charge*12)}else{let q=(t-1)/.9;ring(x,y-75,30+q*240,1-q,1);for(let i=0;i<12;i++){let a=i*Math.PI/6;star(x+Math.cos(a)*(30+q*240),y-75+Math.sin(a)*(30+q*160),13*(1-q)+3,1-q)}}}
}
function tick(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;if(!paused)draw(dt);requestAnimationFrame(tick)}img.onload=()=>{choose(0);requestAnimationFrame(tick)};img.onerror=()=>{detail.textContent='Sprite image failed to load.'};img.src='anicka-sprites.png';})();
</script></html>

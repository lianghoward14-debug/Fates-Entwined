<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810">
  <defs>
    <filter id="flowerGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(31,20,4,.7)"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="rgba(255,224,106,.66)"/>
    </filter>
    <g id="tile">
      <rect width="930" height="136" rx="8" fill="#05080d" stroke="rgba(202,159,54,.85)" stroke-width="1.4"/>
      <rect width="930" height="136" rx="8" fill="rgba(164,126,25,.17)"/>
      <path d="M10 24V10h14M906 10h14v14M920 112v14h-14M24 126H10v-14" fill="none" stroke="rgba(202,159,54,.9)" stroke-width="2"/>
    </g>
    <g id="l06Petals">
      <path d="M32 26c-7-4-9-11-5-17 8 0 12 7 5 17M38 28c1-8 7-13 14-11 3 7-2 13-14 11M39 35c8 0 13 6 11 13-7 3-13-2-11-13M34 38c5 7 2 14-5 17-6-5-5-12 5-17M26 37c-3 8-11 9-16 4 1-8 8-11 16-4M25 29c-8 2-14-3-14-10 6-5 13-2 14 10"/>
    </g>
  </defs>
  <rect width="1200" height="810" fill="#020305"/>
  <style>
    .label{font:18px Arial,sans-serif;fill:#d8d8d8}
    .note{font:15px Arial,sans-serif;fill:#b9b29e}
    .flower{fill:none;stroke:rgba(255,224,106,.99);stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;filter:url(#flowerGlow)}
    .core{fill:rgba(255,224,106,.99);stroke:none;filter:url(#flowerGlow)}
    .detail{fill:none;stroke:rgba(255,224,106,.99);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;filter:url(#flowerGlow)}
  </style>

  <g transform="translate(60 25)">
    <text class="label" x="0" y="22">L-06A</text><text class="note" x="0" y="47">compact core</text><use href="#tile" x="140"/>
    <g class="flower" transform="translate(560 26) scale(1.25)"><use href="#l06Petals"/></g>
    <circle class="core" cx="600" cy="66" r="7.5"/>
  </g>

  <g transform="translate(60 181)">
    <text class="label" x="0" y="22">L-06B</text><text class="note" x="0" y="47">wide core</text><use href="#tile" x="140"/>
    <g class="flower" transform="translate(560 26) scale(1.25)"><use href="#l06Petals"/></g>
    <circle class="core" cx="600" cy="66" r="10"/>
  </g>

  <g transform="translate(60 337)">
    <text class="label" x="0" y="22">L-06C</text><text class="note" x="0" y="47">core + halo</text><use href="#tile" x="140"/>
    <g class="flower" transform="translate(560 26) scale(1.25)"><use href="#l06Petals"/></g>
    <circle class="core" cx="600" cy="66" r="7.5"/>
    <circle class="detail" cx="600" cy="66" r="13"/>
  </g>

  <g transform="translate(60 493)">
    <text class="label" x="0" y="22">L-06D</text><text class="note" x="0" y="47">sun core</text><use href="#tile" x="140"/>
    <g class="flower" transform="translate(560 26) scale(1.25)"><use href="#l06Petals"/></g>
    <circle class="core" cx="600" cy="66" r="8.5"/>
    <g class="detail"><path d="M600 51v-5M600 81v5M585 66h-5M615 66h5M589.4 55.4l-3.6-3.6M610.6 76.6l3.6 3.6M610.6 55.4l3.6-3.6M589.4 76.6l-3.6 3.6"/></g>
  </g>

  <g transform="translate(60 649)">
    <text class="label" x="0" y="22">L-06E</text><text class="note" x="0" y="47">double halo</text><use href="#tile" x="140"/>
    <g class="flower" transform="translate(560 26) scale(1.25)"><use href="#l06Petals"/></g>
    <circle class="core" cx="600" cy="66" r="7.5"/>
    <circle class="detail" cx="600" cy="66" r="12.5"/>
    <circle class="detail" cx="600" cy="66" r="17.5" opacity=".72"/>
  </g>
</svg>

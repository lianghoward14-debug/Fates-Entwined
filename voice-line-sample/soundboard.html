<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Complete Voice-Line Soundboard</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #27304d, #0b0d14 55%); color: #f4f6ff; }
    main { max-width: 900px; margin: auto; padding: 48px 22px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 48px); }
    p { color: #b9c0d8; margin: 0 0 28px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(190px,1fr)); gap: 14px; }
    button { min-height: 120px; padding: 20px; border: 1px solid #3e496d; border-radius: 16px; background: linear-gradient(145deg,#252d48,#171c2e); color: inherit; cursor: pointer; text-align: left; box-shadow: 0 12px 28px #0005; transition: .15s; }
    button:hover { transform: translateY(-2px); border-color: #849cff; }
    button.playing { background: linear-gradient(145deg,#536bc5,#273875); border-color: #b6c4ff; }
    .number { display: block; font-size: 28px; font-weight: 800; }
    .duration { color: #b9c0d8; font-size: 13px; }
    footer { margin-top: 24px; color: #8992ad; font-size: 13px; }
  </style>
</head>
<body>
<main>
  <h1>Complete voice-line soundboard</h1>
  <p>Click any pad to play. Use the search box to jump to a numbered clip.</p>
  <input id="search" inputmode="numeric" placeholder="Jump to clip number…" aria-label="Jump to clip number">
  <section class="grid" id="board"></section>
  <footer>Complete pass: unusable opening material and sub-0.2-second noise artifacts removed. Cuts retain a small portion of each separator gap.</footer>
</main>
<script>
const clipCount = 180;
const board = document.querySelector('#board');
let currentAudio, currentButton;
for (let index = 0; index < clipCount; index++) {
  const n = String(index + 1).padStart(2, '0');
  const button = document.createElement('button');
  button.dataset.clip = index + 1;
  button.innerHTML = `<span class="number">${n}</span><span class="duration">Loading duration…</span>`;
  const probe = new Audio(`clips/voice-line-${n}.mp3`);
  probe.preload = 'metadata';
  probe.onloadedmetadata = () => button.querySelector('.duration').textContent = `${probe.duration.toFixed(3)} seconds`;
  button.onclick = () => {
    if (currentAudio) { currentAudio.pause(); currentButton?.classList.remove('playing'); }
    currentAudio = new Audio(`clips/voice-line-${n}.mp3`);
    currentButton = button;
    button.classList.add('playing');
    currentAudio.onended = () => button.classList.remove('playing');
    currentAudio.play();
  };
  board.append(button);
}
document.querySelector('#search').addEventListener('input', event => {
  const target = board.querySelector(`[data-clip="${Number(event.target.value)}"]`);
  target?.scrollIntoView({behavior:'smooth', block:'center'});
  if (target) { target.animate([{outline:'3px solid #fff'},{outline:'0 solid transparent'}], {duration:900}); }
});
</script>
</body>
</html>

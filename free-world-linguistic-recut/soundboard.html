<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Greek Voice Lines — Phrase Recut</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}body{margin:0;background:radial-gradient(circle at top,#304361,#090b12 58%);color:#f4f7ff}main{max-width:1120px;margin:auto;padding:38px 22px}h1{margin:0 0 8px;font-size:clamp(27px,5vw,45px)}p{margin:0 0 22px;color:#c1c9dc;line-height:1.5}.note{padding:12px 15px;border:1px solid #52627e;border-radius:12px;background:#111827aa}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}button{min-height:110px;padding:14px;border:1px solid #4c5c7b;border-radius:14px;background:linear-gradient(145deg,#283651,#171d2d);color:inherit;text-align:left;cursor:pointer;transition:.12s}button:hover{border-color:#96adff;transform:translateY(-1px)}button.playing{background:linear-gradient(145deg,#5873c8,#293d78)}b{display:block;font-size:19px;margin-bottom:7px}.label{display:block;color:#e7ebf7;font-size:13px;min-height:34px}.meta{display:block;color:#aeb9d1;font-size:12px;margin-top:7px}
  </style>
</head>
<body><main>
  <h1>Greek lines · phrase-aware recut</h1>
  <p class="note">These are cut from spoken phrase boundaries rather than silence alone. The Greek label is an automated transcription aid, not a final translation. Only the clearer part of the problematic source is included in this pass.</p>
  <section class="grid" id="board"></section>
</main>
<script>
let currentAudio, currentButton;
fetch('manifest.json?v=1').then(r=>r.json()).then(lines=>{
  const board=document.querySelector('#board');
  for(const line of lines){
    const button=document.createElement('button');
    button.innerHTML=`<b>Recut ${String(line.id).padStart(3,'0')}</b><span class="label">${line.label}</span><span class="meta">${line.duration.toFixed(2)} seconds</span>`;
    button.onclick=()=>{
      currentAudio?.pause(); currentButton?.classList.remove('playing');
      currentAudio=new Audio(line.file+'?v=1'); currentButton=button; button.classList.add('playing');
      currentAudio.onended=()=>button.classList.remove('playing'); currentAudio.play();
    };
    board.append(button);
  }
}).catch(error=>document.querySelector('#board').textContent='Could not load clips: '+error);
</script></body></html>

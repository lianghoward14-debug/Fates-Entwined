<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free World Short-Clip Merge Review</title>
<style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#33405f,#090b12 60%);color:#f4f6ff}main{max-width:980px;margin:auto;padding:42px 22px}h1{margin:0 0 8px;font-size:clamp(28px,5vw,46px)}p{margin:0 0 26px;color:#bcc4da}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}button{min-height:112px;padding:18px;border:1px solid #4c587d;border-radius:15px;background:linear-gradient(145deg,#29324d,#171c2c);color:inherit;text-align:left;cursor:pointer;box-shadow:0 10px 25px #0005}button:hover{transform:translateY(-2px);border-color:#90a5ff}button.playing{background:linear-gradient(145deg,#5971c9,#293b78)}b{display:block;font-size:21px}span{color:#bdc5dc;font-size:13px}footer{margin-top:25px;color:#8e98b5;font-size:13px}</style></head>
<body><main><h1>Corrected fragment review</h1><p>368 + 369, with the odd leading clip 367 removed.</p><section class="grid" id="board"></section><footer>The other ten approved merges are saved. Rejected pairs 400+401 and 447+448 are discarded.</footer></main>
<script>
const groups=['368-369'];
const board=document.querySelector('#board');let audio,active;
groups.forEach(group=>{const src='clips/merged-'+group+'.mp3',button=document.createElement('button');button.innerHTML=`<b>${group.replaceAll('-',' + ')}</b><span>Loading duration…</span>`;const probe=new Audio(src);probe.preload='metadata';probe.onloadedmetadata=()=>button.querySelector('span').textContent=probe.duration.toFixed(3)+' seconds';button.onclick=()=>{audio?.pause();active?.classList.remove('playing');audio=new Audio(src);active=button;button.classList.add('playing');audio.onended=()=>button.classList.remove('playing');audio.play()};board.append(button)});
</script></body></html>

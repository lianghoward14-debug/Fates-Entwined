name: Build desktop installers

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify updater integration
        run: npm run smoke:desktop-updater
      - name: Build Windows installer
        run: npm run dist -- --publish never
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fates-Entwined-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error

  release-windows-update:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify updater integration
        run: npm run smoke:desktop-updater
      - name: Create monotonic update version
        shell: pwsh
        run: |
          $version = node -e 'const p=require("./package.json"); const [major,minor,patch]=p.version.split("."); console.log([major,minor,Number.parseInt(patch,10)+Number(process.env.GITHUB_RUN_NUMBER)].join("."))'
          if (-not $version) { throw 'Could not create update version' }
          npm version $version --no-git-tag-version --allow-same-version
          "FATE_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "Desktop update version: $version" >> $env:GITHUB_STEP_SUMMARY
      - name: Build and publish GitHub update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist -- --publish always
      - name: Upload stable Windows installer alias
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem -LiteralPath dist -Filter 'Fates-Entwined-Setup-*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw 'No Windows installer was produced.' }
          $stable = Join-Path $installer.DirectoryName 'Fates-Entwined-Installer.exe'
          Copy-Item -LiteralPath $installer.FullName -Destination $stable -Force
          gh release upload "v$env:FATE_RELEASE_VERSION" $stable --clobber

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build macOS dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac -- --publish never
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fates-Entwined-macOS
          path: dist/*.dmg
          if-no-files-found: error

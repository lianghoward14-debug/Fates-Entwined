name: Build desktop installers

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish artifacts under (e.g. v1.39.0)
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: >-
        ${{ github.event_name == 'release' && github.event.release.tag_name
          || github.event_name == 'workflow_dispatch' && inputs.release_tag
          || github.event_name == 'push' && format('build-{0}', github.sha)
          || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run dist -- --publish never
      - name: Upload Windows exe to release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*.exe
          fail_on_unmatched_files: true

  build-macos:
    runs-on: macos-latest
    env:
      RELEASE_TAG: >-
        ${{ github.event_name == 'release' && github.event.release.tag_name
          || github.event_name == 'workflow_dispatch' && inputs.release_tag
          || github.event_name == 'push' && format('build-{0}', github.sha)
          || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build macOS dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac -- --publish never
      - name: Upload macOS dmg to release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*.dmg
          fail_on_unmatched_files: true

name: Deploy Fly authority

on:
  push:
    branches:
      - main
      - codex/fly-authority-deploy
  workflow_dispatch:

concurrency:
  group: deploy-fly-authority
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deploy preflight
        run: |
          npm run smoke:fly-config
          npm run smoke:fly-local-runtime
          npm run smoke:fly-store
          npm run smoke:fly-test-readiness
          npm run smoke:rtdb-rules-lockdown
          npm run smoke:rtdb-disconnect-static
          npm run smoke:rtdb-appcheck-static
          FATE_WS_SMOKE_ALLOW_FAKE=1 npm run smoke:ws-authority
          npm run smoke:authority-bootstrap
          npm run smoke:authority-reducer
          npm run smoke:authority-state-gate
          npm run smoke:authority-strict-reducer
          npm run smoke:authority-two-client-placement
          npm run smoke:card-catalog

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: flyctl deploy --config fly.toml --remote-only

      - name: Verify live readiness
        run: npm run smoke:fly-live-readiness

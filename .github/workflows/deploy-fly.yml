name: Deploy Fly Website

on:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - "fly.toml"
      - "fly.authority-v3-phase7-beta.toml"
      - "server/**"
      - "src/**"
      - "fates-entwined-website/**"
      - "index.html"
      - "package.json"
      - ".github/workflows/deploy-fly.yml"
  workflow_dispatch:

concurrency:
  group: fly-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Warfront before deployment
        run: npm run smoke:warfront

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.toml --remote-only

      - name: Deploy Phase 7 Authority
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.authority-v3-phase7-beta.toml --remote-only

    <g transform="translate(626 258)">
      <rect x="0" y="0" width="440" height="146" rx="8" fill="rgba(255,224,166,.055)" stroke="rgba(255,224,166,.18)"/>
      <text class="note" x="24" y="36">This time the key line is intentionally visible:</text>
      <text class="note" x="24" y="66">mast top -> between sails -> down through open gap -> hull.</text>
      <text class="note" x="24" y="94">Best picks: 29, 33, 38, 39.</text>

    <g transform="translate(554 258)">
      <rect x="0" y="0" width="468" height="132" rx="8" fill="rgba(255,224,166,.055)" stroke="rgba(255,224,166,.18)"/>
      <text class="note" x="24" y="36">I changed the visual grammar, not just the path order:</text>
      <text class="note" x="24" y="66">sails are side pieces, mast is a fat center post, boat is below it.</text>
      <text class="note" x="24" y="96">Best candidates: 50, 52, 57.</text>
    </g>
  </g>
</svg>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>104–106 · Banner animation studies</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151b;color:#eee8df;font:15px/1.5 Arial,sans-serif}main{max-width:1200px;margin:auto;padding:24px}h1,h2{font-family:Georgia,serif;font-weight:400}h1{margin:0;font-size:28px}h2{font-size:21px;margin:25px 0 8px}p{color:#abb8bf}.samples{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}article{min-width:0}canvas{display:block;width:100%;aspect-ratio:700/430;background:radial-gradient(ellipse,#1c2a30,#0c121a)}button{background:#202c33;color:#efd29a;border:1px solid #54625f;border-radius:4px;padding:9px 12px;font:inherit;cursor:pointer}button:hover{background:#32414a}.label{margin:9px 0}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}iframe{width:100%;aspect-ratio:16/8;border:1px solid #354047;background:#10151b}input{width:220px} @media(max-width:650px){.samples{grid-template-columns:1fr}main{padding:16px}iframe{aspect-ratio:4/3}}
</style></head><body><main><h1>Cinematic banner · 104–106</h1><p>Two-second signature effects · glowing line art · original in-game portrait banner</p><iframe id="stage" title="Selected animation with the actual cinematic banner" src="revolution-banner-stage.html"></iframe><div class="controls"><button id="replay">Replay selected with banner</button><button id="all">Play all samples</button><label>Frame <input id="frame" aria-label="Preview frame" type="range" min="0" max="1000" value="450"></label></div><div id="rows"></div></main><script src="revolution-banner-samples.js"></script><script>
const names=['104 · Rivera — A Brighter Future','105 · Jorge Alvarez — A Caribbea for All','106 · Jose Garcia — The Long Game'];let chosen=[0,0],start=0,playing=false,t=.45;const samples=[],slider=document.getElementById('frame');
names.forEach((name,r)=>{const h=document.createElement('h2');h.textContent=name;document.getElementById('rows').append(h);const row=document.createElement('div');row.className='samples';h.after(row);RevolutionBannerSamples.titles[r].forEach((name,v)=>{const article=document.createElement('article'),cv=document.createElement('canvas'),label=document.createElement('div'),button=document.createElement('button');cv.width=700;cv.height=430;cv.setAttribute('aria-label',name+' line-art animation');label.className='label';label.textContent=(104+r)+String.fromCharCode(65+v)+' · '+name;button.textContent='Play with banner';button.onclick=()=>{chosen=[r,v];play()};article.append(cv,label,button);row.append(article);samples.push({cv,r,v})})});
function play(){document.getElementById('stage').contentWindow.postMessage({kind:'preview',r:chosen[0],v:chosen[1]},location.origin)}
document.getElementById('replay').onclick=play;document.getElementById('all').onclick=()=>{start=performance.now();playing=true};slider.oninput=()=>{playing=false;t=slider.value/1000;render()};function render(){samples.forEach(s=>RevolutionBannerSamples.draw(s.cv.getContext('2d'),s.r,s.v,t))}function tick(now){if(playing){t=Math.min(1,(now-start)/2000);slider.value=t*1000;render();if(t===1){playing=false;t=.55;slider.value=550;render()}}requestAnimationFrame(tick)}render();requestAnimationFrame(tick);document.getElementById('stage').addEventListener('load',play);
</script></body></html>

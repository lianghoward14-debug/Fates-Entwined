<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700">
  <defs>
    <radialGradient id="cardShade" cx="50%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#2b2424"/>
      <stop offset="58%" stop-color="#171316"/>
      <stop offset="100%" stop-color="#0c0a0d"/>
    </radialGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#856437"/>
      <stop offset="54%" stop-color="#33271d"/>
      <stop offset="100%" stop-color="#b98b42"/>
    </linearGradient>
    <filter id="boatGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1  0 0.56 0 0 0.42  0 0 0.18 0 0.12  0 0 0 0.82 0" result="warm"/>
      <feMerge>
        <feMergeNode in="warm"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .page{fill:#100d11}
      .card{fill:url(#cardShade);stroke:url(#cardEdge);stroke-width:1.7}
      .cellGlow{fill:rgba(172,91,24,.15)}
      .corner{fill:none;stroke:rgba(255,224,166,.23);stroke-width:1.15}
      .sail{fill:none;stroke:rgba(255,224,166,.98);stroke-width:3.8;stroke-linecap:round;stroke-linejoin:round;filter:url(#boatGlow)}
      .mast{fill:none;stroke:rgba(255,242,197,.99);stroke-width:5.4;stroke-linecap:round;stroke-linejoin:round;filter:url(#boatGlow)}
      .boom{fill:none;stroke:rgba(255,242,197,.96);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;filter:url(#boatGlow)}
      .hull{fill:none;stroke:rgba(255,224,166,.98);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;filter:url(#boatGlow)}
      .thin{fill:none;stroke:rgba(255,224,166,.88);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;filter:url(#boatGlow)}
      .dot{fill:rgba(255,242,197,.99);filter:url(#boatGlow)}
      .sampleNum{fill:#f0c979;font:700 18px Georgia,serif;text-anchor:middle}
      .sampleName{fill:rgba(255,236,191,.82);font:12px Georgia,serif;text-anchor:middle}
      .note{fill:rgba(255,236,191,.58);font:14px Georgia,serif}
      .title{fill:#ffe5aa;font:700 24px Georgia,serif}
    </style>
    <g id="previewCard">
      <rect class="card" x="0" y="0" width="118" height="162" rx="8"/>
      <rect class="cellGlow" x="4" y="4" width="110" height="154" rx="6"/>
      <path class="corner" d="M14 21h20M14 21v20M104 21H84M104 21v20M14 141h20M14 141v-20M104 141H84M104 141v-20"/>
    </g>
  </defs>

  <rect class="page" width="1280" height="700"/>
  <text class="title" x="54" y="46">Anička Voyager real mast redesigns</text>
  <text class="note" x="54" y="70">These are rebuilt with an independent mast: one clear vertical line from sail rigging into the hull, not a sail edge pretending to be a mast.</text>


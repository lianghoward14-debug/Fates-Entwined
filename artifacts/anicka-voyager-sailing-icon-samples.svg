    <g transform="translate(554 250)">
      <rect x="0" y="0" width="420" height="162" rx="8" fill="rgba(255,224,166,.055)" stroke="rgba(255,224,166,.18)"/>
      <text class="note" x="28" y="40">My picks for the actual replacement:</text>
      <text class="note" x="28" y="72">10 if you want instant readability.</text>
      <text class="note" x="28" y="101">3 if you want it to feel more like Anička.</text>
      <text class="note" x="28" y="130">4 if you want the icon to read as naval movement, not a boat.</text>

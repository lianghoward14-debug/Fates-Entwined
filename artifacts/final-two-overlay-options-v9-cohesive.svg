<text class="title" x="42" y="46">SOVIET GRENADIERS + ALEXANDER — COHESIVE PAIRED SYSTEMS</text>
<text class="sub" x="42" y="73">Each column is one shared design grammar applied to both military identities.</text>

<text class="row" x="38" y="252">SOVIET GRENADIERS</text>
<!-- 01 regimental spearhead: vertical core, top identity, paired lower chevrons -->
<g transform="translate(300 105)"><use href="#f"/><text class="num" x="103" y="24" text-anchor="middle">01</text><text class="cap" x="103" y="220" text-anchor="middle">REGIMENTAL</text><rect x="45" y="38" width="116" height="162" fill="#211417"/><rect class="tint" x="45" y="38" width="116" height="162" fill="#5b2424"/><g class="i" transform="translate(74 82)"><path d="M30 8v34M23 17l7-9 7 9M14 39l16 11 16-11M18 50l12 8 12-8M20 29h20"/></g></g>
<!-- 02 formation: three uprights, common baseline, crown rhythm -->
<g transform="translate(530 105)"><use href="#f"/><text class="num" x="103" y="24" text-anchor="middle">02</text><text class="cap" x="103" y="220" text-anchor="middle">FORMATION</text><rect x="45" y="38" width="116" height="162" fill="#211417"/><rect class="tint" x="45" y="38" width="116" height="162" fill="#5b2424"/><g class="i" transform="translate(74 82)"><path d="M15 48V19M30 48V10M45 48V19M11 48h38M11 56h38M11 19l4-8 4 8M26 10l4-8 4 8M41 19l4-8 4 8"/></g></g>
<!-- 03 standard: same flag frame and base -->
<g transform="translate(760 105)"><use href="#f"/><text class="num" x="103" y="24" text-anchor="middle">03</text><text class="cap" x="103" y="220" text-anchor="middle">BATTLE STANDARD</text><rect x="45" y="38" width="116" height="162" fill="#211417"/><rect class="tint" x="45" y="38" width="116" height="162" fill="#5b2424"/><g class="i" transform="translate(74 82)"><path d="M16 55V7M16 12h33l-7 11 7 11H16M10 55h18M24 20h17M24 27h12"/></g></g>
<!-- 04 impact: central weapon, identical burst and damage notch -->
<g transform="translate(990 105)"><use href="#f"/><text class="num" x="103" y="24" text-anchor="middle">04</text><text class="cap" x="103" y="220" text-anchor="middle">IMPACT</text><rect x="45" y="38" width="116" height="162" fill="#211417"/><rect class="tint" x="45" y="38" width="116" height="162" fill="#5b2424"/><g class="i" transform="translate(74 82)"><path d="M30 7v31M24 15h12M20 38h20M14 45l16 11 16-11M10 31h6M44 31h6M15 18l5 5M45 18l-5 5"/></g></g>
<!-- 05 command tab: framed top, bars, downward point -->
<g transform="translate(1220 105)"><use href="#f"/><text class="num" x="103" y="24" text-anchor="middle">05</text><text class="cap" x="103" y="220" text-anchor="middle">COMMAND</text><rect x="45" y="38" width="116" height="162" fill="#211417"/><rect class="tint" x="45" y="38" width="116" height="162" fill="#5b2424"/><g class="i" transform="translate(74 82)"><path d="M12 14h36v27L30 56 12 41zM20 25h20M20 34h20M24 14l6-8 6 8"/></g></g>


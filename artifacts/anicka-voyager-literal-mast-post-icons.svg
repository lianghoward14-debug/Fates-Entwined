<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
  <defs>
    <radialGradient id="cardShade" cx="50%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#2b2424"/>
      <stop offset="58%" stop-color="#171316"/>
      <stop offset="100%" stop-color="#0c0a0d"/>
    </radialGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#856437"/>
      <stop offset="54%" stop-color="#33271d"/>
      <stop offset="100%" stop-color="#b98b42"/>
    </linearGradient>
    <filter id="boatGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.0" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1  0 0.56 0 0 0.42  0 0 0.18 0 0.10  0 0 0 0.78 0" result="warm"/>
      <feMerge>
        <feMergeNode in="warm"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .page{fill:#100d11}
      .card{fill:url(#cardShade);stroke:url(#cardEdge);stroke-width:1.7}
      .cellGlow{fill:rgba(172,91,24,.15)}
      .corner{fill:none;stroke:rgba(255,224,166,.23);stroke-width:1.15}
      .sail{fill:none;stroke:rgba(255,224,166,.94);stroke-width:3.35;stroke-linecap:round;stroke-linejoin:round;filter:url(#boatGlow)}
      .boom{fill:none;stroke:#fff2bf;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;filter:url(#boatGlow)}
      .hull{fill:none;stroke:rgba(255,224,166,.98);stroke-width:4.35;stroke-linecap:round;stroke-linejoin:round;filter:url(#boatGlow)}
      .mastPost{fill:#fff2bf;filter:url(#boatGlow)}
      .mastCore{fill:#fff8d8}
      .thin{fill:none;stroke:rgba(255,224,166,.88);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:url(#boatGlow)}
      .sampleNum{fill:#f0c979;font:700 18px Georgia,serif;text-anchor:middle}
      .sampleName{fill:rgba(255,236,191,.82);font:12px Georgia,serif;text-anchor:middle}
      .note{fill:rgba(255,236,191,.58);font:14px Georgia,serif}
      .title{fill:#ffe5aa;font:700 24px Georgia,serif}
    </style>
    <g id="previewCard">
      <rect class="card" x="0" y="0" width="118" height="162" rx="8"/>
      <rect class="cellGlow" x="4" y="4" width="110" height="154" rx="6"/>
      <path class="corner" d="M14 21h20M14 21v20M104 21H84M104 21v20M14 141h20M14 141v-20M104 141H84M104 141v-20"/>
    </g>
    <g id="post">
      <rect class="mastPost" x="29" y="8" width="7" height="64" rx="3.5"/>
      <rect class="mastCore" x="31" y="10" width="3" height="60" rx="1.5" opacity=".82"/>
    </g>
  </defs>

  <rect class="page" width="1280" height="620"/>
  <text class="title" x="54" y="46">Anička Voyager literal mast-post icons</text>
  <text class="note" x="54" y="70">The mast is now a filled post, not a stroke. It is drawn last, visibly running from above the sails into the hull.</text>

  <g transform="translate(54 110)">
    <g transform="translate(0 0)">
      <use href="#previewCard"/>
      <text class="sampleNum" x="59" y="-13">59</text>
      <g transform="translate(27 48)">
        <path class="sail" d="M25 18L12 49L25 49"/>
        <path class="sail" d="M40 24L52 49L40 49"/>
        <path class="boom" d="M23 50H45"/>
        <path class="hull" d="M8 62c12 8 37 8 49 0l-10 10H17z"/>
        <use href="#post"/>
      </g>
      <text class="sampleName" x="59" y="188">literal post</text>
    </g>

    <g transform="translate(160 0)">
      <use href="#previewCard"/>
      <text class="sampleNum" x="59" y="-13">60</text>
      <g transform="translate(27 48)">
        <path class="sail" d="M24 17L11 49L24 49"/>
        <path class="sail" d="M41 24L53 49L41 49"/>
        <path class="boom" d="M22 50H46"/>
        <path class="hull" d="M7 62c13 9 38 9 51 0l-10 11H16z"/>
        <path class="boom" d="M24 63H44"/>
        <use href="#post"/>
      </g>
      <text class="sampleName" x="59" y="188">deck post</text>
    </g>

    <g transform="translate(320 0)">
      <use href="#previewCard"/>
      <text class="sampleNum" x="59" y="-13">61</text>
      <g transform="translate(27 48)">
        <path class="sail" d="M25 18L13 48L25 48"/>
        <path class="sail" d="M40 25L51 48L40 48"/>
        <path class="boom" d="M23 50H45"/>
        <path class="hull" d="M9 61c12 8 35 8 47 0l-9 10H18z"/>
        <path class="thin" d="M18 74c8 3 19 3 28 0"/>
        <use href="#post"/>
      </g>
      <text class="sampleName" x="59" y="188">clean post</text>
    </g>

    <g transform="translate(480 0)">
      <use href="#previewCard"/>
      <text class="sampleNum" x="59" y="-13">62</text>
      <g transform="translate(27 48)">
        <path class="sail" d="M23 17L10 49L23 49"/>
        <path class="sail" d="M41 25L53 49L41 49"/>
        <path class="boom" d="M22 50H46"/>
        <path class="hull" d="M7 63h51c-6 7-15 10-26 10S13 70 7 63z"/>
        <path class="thin" d="M18 68h28"/>
        <use href="#post"/>
      </g>
      <text class="sampleName" x="59" y="188">wide hull post</text>
    </g>

    <g transform="translate(640 0)">
      <use href="#previewCard"/>
      <text class="sampleNum" x="59" y="-13">63</text>
      <g transform="translate(27 48)">
        <path class="sail" d="M24 17L12 48L24 48"/>
        <path class="sail" d="M41 24L52 48L41 48"/>
        <path class="boom" d="M22 50H46"/>
        <path class="hull" d="M8 62c12 8 37 8 49 0l-9 10H17z"/>
        <path class="thin" d="M36 13l10-7 7 10"/>
        <use href="#post"/>
      </g>
      <text class="sampleName" x="59" y="188">flag post</text>
    </g>

    <g transform="translate(800 0)">
      <use href="#previewCard"/>
      <text class="sampleNum" x="59" y="-13">64</text>
      <g transform="translate(27 48)">
        <path class="sail" d="M24 18L12 48L24 48"/>
        <path class="sail" d="M40 25L51 48L40 48"/>
        <path class="boom" d="M23 49H45"/>
        <path class="hull" d="M8 62c12 8 37 8 49 0l-10 11H17z"/>
        <path class="thin" d="M8 42H1M10 51H3"/>
        <use href="#post"/>
      </g>
      <text class="sampleName" x="59" y="188">motion post</text>
    </g>

    <g transform="translate(960 0)">
      <use href="#previewCard"/>
      <text class="sampleNum" x="59" y="-13">65</text>
      <g transform="translate(27 48)">
        <path class="sail" d="M23 17L11 49L23 49"/>
        <path class="sail" d="M41 24L53 49L41 49"/>
        <path class="boom" d="M22 50H46"/>
        <path class="hull" d="M7 62c13 9 38 9 51 0l-10 12H16z"/>
        <path class="thin" d="M17 70l-7 6M32 72l-3 7M47 70l7 6"/>
        <use href="#post"/>
      </g>
      <text class="sampleName" x="59" y="188">keel post</text>
    </g>

    <g transform="translate(336 250)">
      <rect x="0" y="0" width="520" height="132" rx="8" fill="rgba(255,224,166,.055)" stroke="rgba(255,224,166,.18)"/>
      <text class="note" x="24" y="36">This is the correction: the mast is a visible filled rectangle.</text>
      <text class="note" x="24" y="66">It sits in front of the sails and continues down through the boat.</text>
      <text class="note" x="24" y="96">Best picks: 59, 61, 62.</text>
    </g>
  </g>
</svg>

),linear-gradient(155deg,#101c27,#070d14)}.stage:before{content:'';position:absolute;inset:0;opacity:.14;background-image:linear-gradient(#789c8e30 1px,transparent 1px),linear-gradient(90deg,#789c8e30 1px,transparent 1px);background-size:72px 72px;transform:perspective(500px) rotateX(38deg) scale(1.4);mask-image:radial-gradient(ellipse,#000,transparent 70%)}.stage:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse,transparent 35%,#02060b99);z-index:-1}.stage-heading{position:absolute;top:27px;left:0;right:0;text-align:center;z-index:3;pointer-events:none}.stage-heading .eyebrow{color:#afc9c3;letter-spacing:3px}.stage-heading h2{font:400 26px Georgia,serif;margin:9px 0;color:#f0e0bd}.category-tag{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:#a9d7cd0d;border:1px solid #a9d7cd30;border-radius:20px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#a9d7cd}.category-tag:before{content:'◇';font-size:13px}.cards{position:absolute;inset:135px 7% 95px;display:flex;align-items:center;justify-content:center;gap:clamp(15px,4vw,48px);perspective:1400px}.slot{position:relative;width:clamp(130px,18vw,213px);flex-shrink:0;aspect-ratio:5/7;transform-style:preserve-3d}.card{display:block;position:relative;width:100%;height:100%;padding:0;border:1px solid #c3b18566;border-radius:10px;background:#15232d;box-shadow:0 20px 32px #0009;cursor:pointer;transform-style:preserve-3d;transition:box-shadow .22s,border-color .22s;animation:float 4.3s ease-in-out infinite;animation-delay:calc(var(--i)*-.95s)}.card:hover,.card:focus-visible{border-color:#e8d3a1;box-shadow:0 0 0 1px #e8d3a1,0 0 35px #a9d7cd40,0 25px 45px #000b}.card img{width:100%;height:100%;object-fit:fill;border-radius:9px;display:block;backface-visibility:hidden}.card:after{content:'';position:absolute;inset:0;border-radius:9px;pointer-events:none;background:linear-gradient(130deg,#ffffff10,transparent 45%,#0002)}.card-name{position:abso header{padding:17px 28px}.wordmark{font-size:16px}.wordmark small{font-size:8px}.intro{display:none}main{max-width:1500px;padding:14px 24px 18px}.studies{margin-bottom:12px}.study{padding:11px 18px}.study small{margin-top:5px}.stage{height:calc(100vh - 195px);min-height:710px}.stage-heading{top:19px}.stage-heading h2{font-size:22px;margin:6px 0}.stage-heading .eyebrow{font-size:9px}.category-tag{position:absolute;right:25px;top:7px}.cards{inset:100px 4% 50px;align-items:flex-start;gap:clamp(22px,4vw,65px)}.slot{width:min(27vw,32.15vh);max-width:350px;aspect-ratio:5/7}.card{height:100%;width:100%}.ability-panel{position:absolute;top:calc(100% + 22px);left:-12px;right:-12px;text-align:left;transition:opacity .2s;padding-top:13px;border-top:1px solid #b8cfbf33}.ability-panel h3{font:500 clamp(15px,1.55vw,21px)/1.25 Georgia,serif;color:#eddaae;margin:0 0 9px}.ability-panel p{font:400 clamp(12px,1.03vw,15px)/1.55 Segoe UI,sans-serif;color:#bcc7c8;margin:0}.stage.resolving .ability-panel{opacity:0}.hint{bottom:19px;font-size:11px}.footer{margin-top:12px}.stage[data-style=fan] .slot:first-child{rotate:-4deg;translate:10px 6px}.stage[data-style=fan] .slot:last-child{rotate:4deg;translate:-10px 6px}.stage[data-style=fan] .slot:first-child .ability-panel{rotate:4deg}.stage[data-style=fan] .slot:last-child .ability-panel{rotate:-4deg}

@media(max-width:650px){header{padding:15px}.wordmark small{font-size:7px}main{padding:12px 10px}.stage{height:calc(100vh - 170px);min-height:630px}.cards{inset:100px 3% 50px;gap:12px}.slot{width:29%;max-width:none}.ability-panel{left:0;right:0;top:calc(100% + 18px);padding-top:10px}.ability-panel h3{font-size:14px;line-height:1.25}.ability-panel p{font-size:12px;line-height:1.45}.category-tag{position:static;margin-top:2px;padding:4px 9px}.stage-heading h2{font-size:19px}.stage-heading{top:14px}.study{padding:11px 7px}.study strong{font-size:12px}.study span{font-size:9px}.stage[data-style=fan] .slot:first-child{translate:2px 3px;rotate:-3deg}.stage[data-style=fan] .slot:last-child{translate:-2px 3px;rotate:3deg}.stage[data-style=fan] .slot:first-child .ability-panel{rotate:3deg}.stage[data-style=fan] .slot:last-child .ability-panel{rotate:-3deg}}

.stage{min-height:780px;height:calc(100vh - 195px);overflow:hidden}.stage.resolving .ability-panel{opacity:0;transition:opacity .2s}.card.selected{border-color:#eed09b;box-shadow:0 0 0 2px #eed09b99,0 0 70px #eed09b44}

<body><div class="board-backdrop" aria-hidden="true"></div>
<header><div class="wordmark">FATES ENTWINED<small>CALL TO ARMS · MOTION STUDIES</small></div><span class="draft">INTERACTIVE PREVIEW</span></header>
<main>
<div class="intro"><div><div class="eyebrow">Choose the feeling</div><h1>Three cards. One decisive choice.</h1></div><p>Try each reveal, hover over the cards, then choose one to see its full selection animation.</p></div>
<nav class="studies" role="tablist" aria-label="Animation samples">
<button class="study" role="tab" aria-selected="true" data-style="spotlight"><span>01</span><strong>Royal Lift</strong><small>Lift, spotlight, then collect.</small></button>
<button class="study" role="tab" aria-selected="false" data-style="fan"><span>02</span><strong>Royal Sweep</strong><small>A sweeping turn into your hand.</small></button>
<button class="study" role="tab" aria-selected="false" data-style="rift"><span>03</span><strong>Royal Seal</strong><small>A golden pulse seals your choice.</small></button>
</nav>
<section class="stage" data-style="spotlight" aria-label="Interactive card selection preview">
<div class="ambient"></div><div class="stage-heading"><div class="eyebrow">Call to Arms</div><h2>Choose your reinforcement</h2><span class="category-tag">Remove</span></div>
<div class="cards"></div><div class="flare"></div><div class="hint" aria-live="polite"><b>Choose one card</b> to add to your hand</div><div class="hand" aria-hidden="true"></div>
</section>
<div class="footer"><div class="description"></div><button class="replay" type="button">↻ Replay reveal</button></div>
</main>
<script type="module">
import {playSupportCompanyAnimation} from '../src/scripts/support-company-animation.mjs?v=20261008-categories';
const definitions=[{id:'14',name:'Alondra Hopkins',ability:'Unseen Strikes',effect:"While this card is on the field, your opponent cannot set any Supporter adjacent to this card. Any opponent Supporter card that was adjacent or diagonal to this card when it is set are discarded, and this card gains 1 Fate for each one."},{id:'16',name:'MINAE Death Squad',ability:'Preserving the Environment',effect:"When set, you can discard an opponent's Supporter in this zone."},{id:'30',name:'Santiago',ability:'El Matador del Mares',effect:"Select one of your opponent's cards in this zone's contested row; discard it."}];

const descriptions={spotlight:'<strong>01 / Royal Lift</strong> — The chosen card rises, straightens, and holds center stage before settling into your hand.',fan:'<strong>02 / Royal Sweep</strong> — The chosen card sweeps across the fan with a three-dimensional turn, then follows a curved path into your hand.',rift:'<strong>03 / Royal Seal</strong> — Your choice lifts into a golden pulse, holds for recognition, then contracts into your hand.'};
function selectionSound(){try{const Audio=window.AudioContext||window.webkitAudioContext;const ctx=new Audio();ctx.resume();[440,660,880,1320].forEach((hz,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(hz,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(hz*1.08,ctx.currentTime+.5);g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(.035,ctx.currentTime+.025+i*.035);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.8+i*.08);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+1.2);});setTimeout(()=>ctx.close(),1600);}catch{}}

const stage=document.querySelector('.stage'),cards=document.querySelector('.cards'),hint=document.querySelector('.hint');
let generation=0,busy=false,style='spotlight',animations=[];
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function motion(el,frames,options={}){const a=el.animate(frames,{duration:650,fill:'both',easing:'cubic-bezier(.2,.75,.2,1)',...options,...(reduced()?{duration:100,delay:0}:{})});animations.push(a);return a.finished.catch(()=>{});}
function reset(next=style){generation++;animations.forEach(a=>a.cancel());animations=[];stage.querySelectorAll('.support-company-cinematic,.support-company-vignette,.particle,.selection-caption').forEach(e=>e.remove());busy=false;style=next;stage.dataset.style=style;stage.classList.remove('resolving','done');hint.innerHTML='<b>Choose one card</b> to add to your hand';document.querySelector('.description').innerHTML=descriptions[style];document.querySelectorAll('.study').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.style===style)));
 cards.innerHTML=definitions.map((c,i)=>`<div class="slot" style="--i:${i};--angle:${(i-1)*4}deg"><button class="card" aria-label="Choose ${c.name}" style="--i:${i}"><img src="../${c.id}.png" alt="${c.name}" draggable="false"></button><div class="ability-panel"><h3>${c.ability}</h3><p>${c.effect}</p></div></div>`).join('');
 cards.querySelectorAll('.card').forEach((card,i)=>{card.onclick=()=>choose(card,i);const offset=(1-i)*(card.offsetWidth+40);motion(card,[{opacity:0,transform:`translate(${offset}px,65px) rotateY(70deg) scale(.8)`,rotate:'0deg'},{opacity:1,transform:'none',rotate:`${(i-1)*4}deg`}],{duration:1100,delay:i*140}).then(()=>{if(!busy){const hover=card.animate([{translate:'0px 0px'},{translate:'0px -12px'},{translate:'0px 0px'}],{duration:3600+i*250,iterations:Infinity,easing:'ease-in-out'});animations.push(hover);}});});
}
async function choose(card,index){if(busy)return;selectionSound();busy=true;const run=generation;stage.classList.add('resolving');card.classList.add('selected');card.parentElement.style.zIndex=6;const all=[...cards.querySelectorAll('.card')];all.forEach(c=>{c.disabled=true;c.style.animation='none';c.getAnimations().forEach(a=>a.cancel());});const area=stage.getBoundingClientRect(),box=card.getBoundingClientRect();const dx=area.left+area.width/2-box.left-box.width/2,dy=area.top+area.height*.43-box.top-box.height/2,endY=area.bottom-box.top-box.height/2;const pose=`translate(${dx}px,${dy}px) scale(1.07)`;
 const caption=document.createElement('div');caption.className='selection-caption';caption.innerHTML='<small>REINFORCEMENT SELECTED</small>'+definitions[index].name;stage.append(caption);motion(caption,[{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{delay:550});
 all.filter(c=>c!==card).forEach((c,i)=>motion(c,[{opacity:1,transform:'none'},{opacity:0,transform:`translate(${i?-100:100}px,130px) rotateZ(${i?18:-18}deg) scale(.65)`}],{duration:650}));
 if(style==='spotlight')await motion(card,[{transform:'none',rotate:`${(index-1)*4}deg`},{transform:`translate(${dx}px,${dy-30}px) scale(1.12)`,rotate:'0deg',offset:.65},{transform:pose,rotate:'0deg'}],{duration:1100});
 if(style==='fan')await motion(card,[{transform:'none',rotate:`${(index-1)*4}deg`},{transform:`translate(${dx-70}px,${dy-45}px) rotateY(-38deg) rotateZ(-12deg) scale(1.08)`,rotate:'0deg',offset:.45},{transform:pose,rotate:'0deg'}],{duration:1400});
 if(style==='rift'){motion(document.querySelector('.flare'),[{opacity:0,transform:'translate(-50%,-65%) scale(1)'},{opacity:.75,offset:.4},{opacity:0,transform:'translate(-50%,-65%) scale(15)'}],{duration:1300});await motion(card,[{transform:'none',rotate:`${(index-1)*4}deg`,filter:'brightness(1)'},{transform:`translate(${dx}px,${dy}px) scale(1.17)`,rotate:'0deg',filter:'brightness(1.6)',offset:.6},{transform:pose,rotate:'0deg',filter:'brightness(1)'}],{duration:1250});}
 if(run!==generation)return;
 await motion(card,[{transform:pose,rotate:'0deg'},{transform:pose,rotate:'0deg'}],{duration:650});
 if(run!==generation)return;motion(caption,[{opacity:1},{opacity:0}],{duration:350});
 const frames=style==='fan'?[{transform:pose,opacity:1,rotate:'0deg'},{transform:`translate(${dx+125}px,${dy+70}px) rotateZ(20deg) scale(.78)`,opacity:1,rotate:'0deg',offset:.45},{transform:`translate(${dx}px,${endY}px) rotateZ(-8deg) scale(.1)`,opacity:0,rotate:'0deg'}]:[{transform:pose,opacity:1,rotate:'0deg'},{transform:`translate(${dx}px,${endY}px) scale(.1)`,opacity:0,rotate:'0deg'}];
 await motion(card,frames,{duration:style==='fan'?950:750,easing:'cubic-bezier(.5,0,.75,.4)'});if(run!==generation)return;
 await playSupportCompanyAnimation({host:stage,variant:'call-crossed',categoryLabel:'Remove',duration:1800});if(run!==generation)return;stage.classList.add('done');hint.textContent=definitions[index].name+' added to your hand';
}
 document.querySelectorAll('.study').forEach(b=>b.onclick=()=>reset(b.dataset.style));document.querySelector('.replay').onclick=()=>reset();reset('rift');window.motionPreview={reset,choose:i=>choose(cards.querySelectorAll('.card')[i],i)};
</script>
</body></html>

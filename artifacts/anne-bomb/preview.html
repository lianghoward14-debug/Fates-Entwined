<!doctype html><html><head><meta charset="utf-8"><title>Anne Stone — The Black Rose</title><link rel="stylesheet" href="../../src/styles/game.css"><style>body{margin:0;background:#10151e;color:#eee;font:18px Georgia;text-align:center;padding:40px}h1{font-size:30px}p{color:#bec6d4}.stage{display:flex;justify-content:center;gap:60px;align-items:center;margin:35px auto}.portrait{width:180px;border-radius:12px}.cell{width:180px;height:250px;border:2px solid #ad8950;border-radius:12px;position:relative;background:#202a32}.victim{width:100%;height:100%;object-fit:contain;opacity:0;transform:translateY(-90px);transition:transform .5s,opacity .2s}.victim.placed{opacity:1;transform:translateY(0)}button{padding:12px 25px;background:#963b2c;color:white;border:1px solid #ffbd76;border-radius:6px;font-size:18px;cursor:pointer}#status{min-height:50px}.cell:not(.black-rose-bomb-square) .black-rose-bomb-overlay{display:none}</style></head><body><h1>The Black Rose</h1><p>Anne’s redesigned hidden bomb overlay + explosion</p><div class="stage"><img class="portrait" src="../../102.png" alt="Anne Stone"><div class="cell black-rose-bomb-square" data-z="0" data-r="1" data-c="1" ><div class="black-rose-bomb-overlay"><span class="black-rose-bomb-icon"><svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="29" cy="39" r="18"/><path d="M26 21v-6h8v7M30 15c0-8 13-3 13-10"/><path d="M46 7l5-2M48 13l5 2M39 5l-2-3" stroke-width="3"/><path d="M18 36c0-5 4-9 8-10" stroke-width="3" opacity=".45"/></g></svg></span></div><img class="victim" src="../../65.png" alt="Opponent card"></div></div><p id="status">The marked square is visible only to Anne’s owner.</p><button onclick="replay()">Place enemy card · Replay</button><script>const explosionAudio=new Audio('../../soundeffects/codex-redesign/black_rose_explosion.wav');explosionAudio.preload='auto';explosionAudio.volume=.9;function playSfx(){explosionAudio.volume=.9;explosionAudio.currentTime=0;explosionAudio.play().catch(()=>{});}function playBlackRoseExplosion(z,r,c){
  const cell=document.querySelector('.cell[data-z="'+z+'"][data-r="'+r+'"][data-c="'+c+'"]');
  const rect=cell?.getBoundingClientRect();
  const blast=document.createElement('div');blast.className='black-rose-explosion';blast.style.left=(rect?rect.left+rect.width/2:innerWidth/2)+'px';blast.style.top=(rect?rect.top+rect.height/2:innerHeight/2)+'px';document.body.appendChild(blast);setTimeout(()=>blast.remove(),1000);
  if(typeof playSfx==='function') playSfx('blackRoseExplosion');
}
let busy=false;function replay(){if(busy)return;explosionAudio.volume=0;explosionAudio.play().then(()=>{explosionAudio.pause();explosionAudio.currentTime=0;}).catch(()=>{});busy=true;const card=document.querySelector('.victim'),cell=document.querySelector('.cell'),status=document.querySelector('#status');cell.classList.remove('black-rose-bomb-square');card.classList.add('placed');status.textContent='Opponent places a card on the armed square…';setTimeout(()=>{playBlackRoseExplosion(0,1,1);card.style.opacity=0;status.textContent='Explosion! Card discarded; its effect never activates.';},600);setTimeout(()=>{card.classList.remove('placed');card.style.opacity='';cell.classList.add('black-rose-bomb-square');busy=false;},2000)}</script></body></html>

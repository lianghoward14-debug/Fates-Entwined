<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
 <title id="title">New private status icon designs for cards 104 and 105 with blue Anne bomb</title>
 <desc id="desc">Anne's approved bomb in owner blue, plus three new designs each for Rivera and Jorge.</desc>
 <defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111c"/><stop offset=".6" stop-color="#0b1724"/><stop offset="1" stop-color="#040a11"/></linearGradient>
  <linearGradient id="panel" y2="1"><stop stop-color="#17283a"/><stop offset="1" stop-color="#0b1723"/></linearGradient>
  <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".45" fill="#fff" opacity=".05"/><circle cx="6" cy="5" r=".35" fill="#fff" opacity=".03"/></pattern>
  <filter id="shadow"><feDropShadow dy="7" stdDeviation="8" flood-opacity=".5"/></filter>

  <symbol id="bomb" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="30" cy="39" r="16.5" stroke-width="4"/><path d="M27 22v-6h8v7M31 16c0-7 11-5 13-11" stroke-width="4"/><path d="M46 7l5-3M48 13l6 1M40 5l-1-4" stroke-width="3"/><path d="M19 36c1-5 4-8 8-10" stroke-width="3" opacity=".45"/></g></symbol>

  <!-- 104: fate hourglass -->
  <symbol id="r-hourglass" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17 9h30M17 55h30M21 10c0 12 4 17 11 22-7 5-11 10-11 22M43 10c0 12-4 17-11 22 7 5 11 10 11 22" stroke-width="3.8"/><path d="M24 17h16l-8 10zM24 48c3-7 13-7 16 0z" stroke-width="2.6"/><path d="M32 29v7" stroke-width="3"/><path d="M8 24h10M46 24h10M8 24l5-5M8 24l5 5M56 24l-5-5M56 24l-5 5" stroke-width="3" opacity=".75"/></g></symbol>

  <!-- 104: fate funnel -->
  <symbol id="r-funnel" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h46L39 32v17l-14 6V32z" stroke-width="4"/><path d="M16 5v9M32 3v11M48 5v9" stroke-width="3"/><circle cx="16" cy="20" r="2.5" stroke-width="2.5"/><path d="M32 16l3 6 7 .9-5 4.8 1.2 6.8-6.2-3.2-6.2 3.2 1.2-6.8-5-4.8 7-.9z" stroke-width="2.5"/><circle cx="48" cy="20" r="2.5" stroke-width="2.5"/></g></symbol>

  <!-- 104: fate exchange arrows into diamond -->
  <symbol id="r-converge" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17h15c7 0 10 5 10 12M57 17H42c-7 0-10 5-10 12" stroke-width="4"/><path d="M7 17l7-7M7 17l7 7M57 17l-7-7M57 17l-7 7" stroke-width="3.5"/><path d="M32 25l13 13-13 17-13-17z" stroke-width="4"/><path d="M32 32v15M27 39h10" stroke-width="3" opacity=".65"/></g></symbol>

  <!-- 105: three cards answer a rally flare -->
  <symbol id="j-threecards" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="22" y="16" width="20" height="32" rx="3" stroke-width="4"/><path d="M19 21l-8 3 9 29 13-4M45 21l8 3-9 29-13-4" stroke-width="3.2"/><circle cx="32" cy="27" r="4" stroke-width="2.4"/><path d="M32 35l5 8H27z" stroke-width="2.4"/><path d="M15 10l5 5M32 5v7M49 10l-5 5" stroke-width="3"/></g></symbol>

  <!-- 105: signal beacon calling three types -->
  <symbol id="j-beacon" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M25 50h14M28 39h8l3 11H25z" stroke-width="3.5"/><path d="M32 12v8M14 20l7 6M50 20l-7 6" stroke-width="3.5"/><path d="M18 42c-8-8-8-21 0-29M46 42c8-8 8-21 0-29" stroke-width="3" opacity=".7"/><circle cx="32" cy="29" r="5" stroke-width="3"/><path d="M8 48h8M12 44v8M48 48h8M52 44v8" stroke-width="2.6"/></g></symbol>

  <!-- 105: command seal with three type notches -->
  <symbol id="j-seal" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="30" r="20" stroke-width="4"/><path d="M21 48l-3 11 14-6 14 6-3-11" stroke-width="3.5"/><circle cx="21" cy="29" r="4" stroke-width="2.5"/><path d="M32 22l5 9H27z" stroke-width="2.5"/><rect x="40" y="25" width="8" height="8" rx="1" stroke-width="2.5"/><path d="M32 5v5M9 18l5 2M55 18l-5 2" stroke-width="3"/></g></symbol>
 </defs>
 <rect width="1200" height="850" fill="url(#bg)"/><rect width="1200" height="850" fill="url(#grain)"/>
 <text x="55" y="58" fill="#f4df92" font-family="Georgia,serif" font-size="27" font-weight="700" letter-spacing="4">PRIVATE STATUS CRESTS · NEW ROUND</text>
 <text x="55" y="89" fill="#91a8bb" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">OWNER-SIDE BLUE · BANNER-SCALE LINE ART</text>
 <line y1="116" x2="1200" y2="116" stroke="#dabb62" stroke-opacity=".18"/>

 <!-- approved Anne reference -->
 <g transform="translate(42 145)" filter="url(#shadow)"><rect width="1116" height="118" rx="17" fill="url(#panel)" stroke="#315970" stroke-width="2"/><circle cx="70" cy="59" r="42" fill="#091725" stroke="#7eb7ff" stroke-width="3"/><use href="#bomb" x="36" y="25" width="68" height="68" color="#b9dcff"/><text x="135" y="42" fill="#91a9bd" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">102 · THE BLACK ROSE</text><text x="135" y="72" fill="#f3e9c8" font-family="Georgia,serif" font-size="23" font-weight="700">Bomb Armed</text><text x="135" y="96" fill="#6f879b" font-family="Arial,sans-serif" font-size="12">approved design · corrected to owner-status blue</text><g transform="translate(935 37)"><rect width="145" height="42" rx="21" fill="#102a3d" stroke="#62b6dc"/><text x="72" y="26" text-anchor="middle" fill="#9bdcf6" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">LOCKED DESIGN</text></g></g>

 <g font-family="Arial,sans-serif"><text x="52" y="306" fill="#e7c968" font-size="13" font-weight="700" letter-spacing="2.2">104 · A BRIGHTER FUTURE</text><text x="625" y="306" fill="#e7c968" font-size="13" font-weight="700" letter-spacing="2.2">105 · A CARIBBEA FOR ALL</text></g>

 <!-- six options -->
 <g filter="url(#shadow)" font-family="Arial,sans-serif">
  <g transform="translate(42 330)"><rect width="168" height="294" rx="17" fill="url(#panel)" stroke="#315970" stroke-width="2"/><circle cx="84" cy="91" r="57" fill="#091725" stroke="#7eb7ff" stroke-width="3"/><use href="#r-hourglass" x="38" y="45" width="92" height="92" color="#b9dcff"/><text x="84" y="178" text-anchor="middle" fill="#f3e9c8" font-family="Georgia,serif" font-size="18" font-weight="700">A</text><text x="84" y="202" text-anchor="middle" fill="#b9dcff" font-size="12" font-weight="700">FATE HOURGLASS</text><text x="84" y="226" text-anchor="middle" fill="#7890a4" font-size="10">gains held for</text><text x="84" y="241" text-anchor="middle" fill="#7890a4" font-size="10">the next turn</text></g>
  <g transform="translate(226 330)"><rect width="168" height="294" rx="17" fill="url(#panel)" stroke="#315970" stroke-width="2"/><circle cx="84" cy="91" r="57" fill="#091725" stroke="#7eb7ff" stroke-width="3"/><use href="#r-funnel" x="38" y="45" width="92" height="92" color="#b9dcff"/><text x="84" y="178" text-anchor="middle" fill="#f3e9c8" font-family="Georgia,serif" font-size="18" font-weight="700">B</text><text x="84" y="202" text-anchor="middle" fill="#b9dcff" font-size="12" font-weight="700">FATE FUNNEL</text><text x="84" y="226" text-anchor="middle" fill="#7890a4" font-size="10">every gain feeds</text><text x="84" y="241" text-anchor="middle" fill="#7890a4" font-size="10">one destination</text></g>
  <g transform="translate(410 330)"><rect width="168" height="294" rx="17" fill="url(#panel)" stroke="#315970" stroke-width="2"/><circle cx="84" cy="91" r="57" fill="#091725" stroke="#7eb7ff" stroke-width="3"/><use href="#r-converge" x="38" y="45" width="92" height="92" color="#b9dcff"/><text x="84" y="178" text-anchor="middle" fill="#f3e9c8" font-family="Georgia,serif" font-size="18" font-weight="700">C</text><text x="84" y="202" text-anchor="middle" fill="#b9dcff" font-size="12" font-weight="700">CONVERGENCE</text><text x="84" y="226" text-anchor="middle" fill="#7890a4" font-size="10">both sides flow</text><text x="84" y="241" text-anchor="middle" fill="#7890a4" font-size="10">into Rivera</text></g>

  <g transform="translate(624 330)"><rect width="168" height="294" rx="17" fill="url(#panel)" stroke="#315970" stroke-width="2"/><circle cx="84" cy="91" r="57" fill="#091725" stroke="#7eb7ff" stroke-width="3"/><use href="#j-threecards" x="38" y="45" width="92" height="92" color="#b9dcff"/><text x="84" y="178" text-anchor="middle" fill="#f3e9c8" font-family="Georgia,serif" font-size="18" font-weight="700">A</text><text x="84" y="202" text-anchor="middle" fill="#b9dcff" font-size="12" font-weight="700">CALLED CARDS</text><text x="84" y="226" text-anchor="middle" fill="#7890a4" font-size="10">three types answer</text><text x="84" y="241" text-anchor="middle" fill="#7890a4" font-size="10">the declaration</text></g>
  <g transform="translate(808 330)"><rect width="168" height="294" rx="17" fill="url(#panel)" stroke="#315970" stroke-width="2"/><circle cx="84" cy="91" r="57" fill="#091725" stroke="#7eb7ff" stroke-width="3"/><use href="#j-beacon" x="38" y="45" width="92" height="92" color="#b9dcff"/><text x="84" y="178" text-anchor="middle" fill="#f3e9c8" font-family="Georgia,serif" font-size="18" font-weight="700">B</text><text x="84" y="202" text-anchor="middle" fill="#b9dcff" font-size="12" font-weight="700">RALLY BEACON</text><text x="84" y="226" text-anchor="middle" fill="#7890a4" font-size="10">signal waiting to</text><text x="84" y="241" text-anchor="middle" fill="#7890a4" font-size="10">call the people</text></g>
  <g transform="translate(992 330)"><rect width="168" height="294" rx="17" fill="url(#panel)" stroke="#315970" stroke-width="2"/><circle cx="84" cy="91" r="57" fill="#091725" stroke="#7eb7ff" stroke-width="3"/><use href="#j-seal" x="38" y="45" width="92" height="92" color="#b9dcff"/><text x="84" y="178" text-anchor="middle" fill="#f3e9c8" font-family="Georgia,serif" font-size="18" font-weight="700">C</text><text x="84" y="202" text-anchor="middle" fill="#b9dcff" font-size="12" font-weight="700">COMMAND SEAL</text><text x="84" y="226" text-anchor="middle" fill="#7890a4" font-size="10">declared type</text><text x="84" y="241" text-anchor="middle" fill="#7890a4" font-size="10">under orders</text></g>
 </g>

 <!-- actual size row -->
 <g transform="translate(42 665)" font-family="Arial,sans-serif"><text y="0" fill="#6f879b" font-size="10" letter-spacing="1.5">ACTUAL BANNER-SCALE CHECK</text><rect y="18" width="1116" height="104" rx="16" fill="#0b1724" stroke="#315970" stroke-width="2"/>
  <g transform="translate(20 34)"><circle cx="27" cy="27" r="25" fill="#091725" stroke="#7eb7ff" stroke-width="2"/><use href="#bomb" x="7" y="7" width="40" height="40" color="#b9dcff"/></g>
  <line x1="93" y1="31" x2="93" y2="91" stroke="#527086" opacity=".5"/>
  <g transform="translate(112 34)"><circle cx="27" cy="27" r="25" fill="#091725" stroke="#7eb7ff" stroke-width="2"/><use href="#r-hourglass" x="7" y="7" width="40" height="40" color="#b9dcff"/></g><g transform="translate(178 34)"><circle cx="27" cy="27" r="25" fill="#091725" stroke="#7eb7ff" stroke-width="2"/><use href="#r-funnel" x="7" y="7" width="40" height="40" color="#b9dcff"/></g><g transform="translate(244 34)"><circle cx="27" cy="27" r="25" fill="#091725" stroke="#7eb7ff" stroke-width="2"/><use href="#r-converge" x="7" y="7" width="40" height="40" color="#b9dcff"/></g>
  <line x1="317" y1="31" x2="317" y2="91" stroke="#527086" opacity=".5"/>
  <g transform="translate(336 34)"><circle cx="27" cy="27" r="25" fill="#091725" stroke="#7eb7ff" stroke-width="2"/><use href="#j-threecards" x="7" y="7" width="40" height="40" color="#b9dcff"/></g><g transform="translate(402 34)"><circle cx="27" cy="27" r="25" fill="#091725" stroke="#7eb7ff" stroke-width="2"/><use href="#j-beacon" x="7" y="7" width="40" height="40" color="#b9dcff"/></g><g transform="translate(468 34)"><circle cx="27" cy="27" r="25" fill="#091725" stroke="#7eb7ff" stroke-width="2"/><use href="#j-seal" x="7" y="7" width="40" height="40" color="#b9dcff"/></g>
  <text x="565" y="57" fill="#91a9bd" font-size="11" font-weight="700" letter-spacing="1.8">ALL OWNER-ONLY EFFECTS</text><text x="565" y="81" fill="#f3e9c8" font-family="Georgia,serif" font-size="18" font-weight="700">Same blue treatment as regular owner status icons</text>
 </g>
</svg>

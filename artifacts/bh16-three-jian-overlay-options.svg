<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <defs>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#062522" flood-opacity=".9"/><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#7ff8ee" flood-opacity=".7"/></filter>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173332"/><stop offset=".58" stop-color="#102927"/><stop offset="1" stop-color="#091918"/></linearGradient>
    <g id="frame"><rect width="240" height="238" rx="9" fill="#05080d" stroke="#ca9f36" stroke-opacity=".9" stroke-width="1.5"/><rect x="4" y="4" width="232" height="230" rx="7" fill="url(#tile)" fill-opacity=".92"/><path d="M14 36V14h22M204 14h22v22M226 202v22h-22M36 224H14v-22" fill="none" stroke="#ca9f36" stroke-opacity=".75" stroke-width="2"/></g>
    <g id="jian"><path d="M0-54 6-42 4 30 0 38-4 30-6-42Z"/><path d="M-13 30Q0 24 13 30L8 35H-8Z"/><path d="M0 35v17M-5 39h10M-4 52h8"/></g>
    <g id="jianWide"><path d="M0-58 8-43 5 29 0 39-5 29-8-43Z"/><path d="M-15 29Q0 21 15 29L9 35H-9Z"/><path d="M0 35v18M-5 40h10M-4 53h8"/></g>
    <style>.title{font:700 30px Georgia,serif;fill:#f1d69d;letter-spacing:.8px}.sub{font:14px Georgia,serif;fill:#9f8967}.id{font:700 19px Georgia,serif;fill:#e6c879;text-anchor:middle}.name{font:13px Georgia,serif;fill:#c7aa7a;text-anchor:middle}.blade{fill:#123d3a;fill-opacity:.78;stroke:#bbfff9;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow)}.detail{fill:none;stroke:#ecfffb;stroke-width:2;stroke-linecap:round;filter:url(#glow)}.ring{fill:none;stroke:#7ff8ee;stroke-width:2.3;filter:url(#glow)}</style>
  </defs>
  <rect width="1400" height="720" fill="#020305"/>
  <text class="title" x="60" y="48">LI-HUA — THREE JIAN OVERLAY OPTIONS</text><text class="sub" x="60" y="74">Ten readable crossed-sword crests using Chinese jian blades and the current overlay glow.</text>

  <g transform="translate(60 105)"><use href="#frame"/><text class="id" x="120" y="28">LH-J01</text><g class="blade" transform="translate(120 121)"><use href="#jian"/><use href="#jian" transform="rotate(120)"/><use href="#jian" transform="rotate(240)"/></g><text class="name" x="120" y="212">balanced triad</text></g>
  <g transform="translate(330 105)"><use href="#frame"/><text class="id" x="120" y="28">LH-J02</text><g class="blade" transform="translate(120 121)"><use href="#jianWide"/><use href="#jianWide" transform="rotate(120)"/><use href="#jianWide" transform="rotate(240)"/></g><path class="detail" d="M112 121h16M120 113v16"/><text class="name" x="120" y="212">broad blades</text></g>
  <g transform="translate(600 105)"><use href="#frame"/><text class="id" x="120" y="28">LH-J03</text><g class="blade" transform="translate(120 121)"><use href="#jian" transform="translate(0 -4)"/><use href="#jian" transform="rotate(112) translate(0 -4)"/><use href="#jian" transform="rotate(248) translate(0 -4)"/></g><circle class="ring" cx="120" cy="121" r="17"/><text class="name" x="120" y="212">jade wheel</text></g>
  <g transform="translate(870 105)"><use href="#frame"/><text class="id" x="120" y="28">LH-J04</text><g class="blade" transform="translate(120 121)"><use href="#jian"/><use href="#jian" transform="rotate(105)"/><use href="#jian" transform="rotate(255)"/></g><path class="detail" d="M103 120q17-18 34 0-17 18-34 0Z"/><text class="name" x="120" y="212">storm eye</text></g>
  <g transform="translate(1140 105)"><use href="#frame"/><text class="id" x="120" y="28">LH-J05</text><g class="blade" transform="translate(120 121)"><use href="#jianWide"/><use href="#jian" transform="rotate(118)"/><use href="#jian" transform="rotate(242)"/></g><path class="detail" d="M109 122l11-11 11 11-11 11Z"/><text class="name" x="120" y="212">diamond guard</text></g>

  <g transform="translate(60 375)"><use href="#frame"/><text class="id" x="120" y="28">LH-J06</text><g class="blade" transform="translate(120 121)"><use href="#jian" transform="translate(0 -7)"/><use href="#jian" transform="rotate(120) translate(0 -7)"/><use href="#jian" transform="rotate(240) translate(0 -7)"/></g><path class="detail" d="M120 106l13 8v15l-13 8-13-8v-15Z"/><text class="name" x="120" y="212">hexagonal crest</text></g>
  <g transform="translate(330 375)"><use href="#frame"/><text class="id" x="120" y="28">LH-J07</text><g class="blade" transform="translate(120 121)"><use href="#jianWide" transform="scale(1.05)"/><use href="#jian" transform="rotate(128) scale(.92)"/><use href="#jian" transform="rotate(232) scale(.92)"/></g><path class="detail" d="M107 126q13-24 26 0"/><text class="name" x="120" y="212">commanding center</text></g>
  <g transform="translate(600 375)"><use href="#frame"/><text class="id" x="120" y="28">LH-J08</text><g class="blade" transform="translate(120 121)"><use href="#jian"/><use href="#jian" transform="rotate(120)"/><use href="#jian" transform="rotate(240)"/></g><path class="detail" d="M101 121c7-12 31-12 38 0-7 12-31 12-38 0ZM120 109v24"/><text class="name" x="120" y="212">moonlit knot</text></g>
  <g transform="translate(870 375)"><use href="#frame"/><text class="id" x="120" y="28">LH-J09</text><g class="blade" transform="translate(120 121)"><use href="#jianWide"/><use href="#jianWide" transform="rotate(120)"/><use href="#jianWide" transform="rotate(240)"/></g><circle cx="120" cy="121" r="9" fill="#bbfff9" filter="url(#glow)"/><circle cx="120" cy="121" r="3" fill="#123d3a"/><text class="name" x="120" y="212">bright core</text></g>
  <g transform="translate(1140 375)"><use href="#frame"/><text class="id" x="120" y="28">LH-J10</text><g class="blade" transform="translate(120 121)"><use href="#jianWide" transform="translate(0 -5)"/><use href="#jianWide" transform="rotate(120) translate(0 -5)"/><use href="#jianWide" transform="rotate(240) translate(0 -5)"/></g><circle class="ring" cx="120" cy="121" r="19"/><path class="detail" d="M120 100v8M141 121h-8M120 142v-8M99 121h8"/><text class="name" x="120" y="212">ten-thousand blades</text></g>
</svg>

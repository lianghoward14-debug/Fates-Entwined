  <radialGradient id="ib"><stop stop-color="#477abe" stop-opacity=".24"/><stop offset="1" stop-color="#070e1b" stop-opacity=".72"/></radialGradient>
  <pattern id="g" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".45" fill="#fff" opacity=".05"/></pattern>
  <filter id="s"><feDropShadow dy="7" stdDeviation="8" flood-opacity=".5"/></filter>
  <symbol id="bugle" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 27h14l24-11v31L26 36H12z"/><path d="M18 37l4 14h11l-3-13"/><path d="M52 24h5M52 32h7M52 40h5" stroke-width="3.5"/></g></symbol>

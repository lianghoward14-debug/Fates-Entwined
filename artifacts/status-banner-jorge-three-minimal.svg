  <g transform="translate(424 150)"><rect width="352" height="292" rx="18" fill="url(#panel)" stroke="#315970" stroke-width="2"/><circle cx="176" cy="108" r="73" fill="url(#ib)" stroke="#7eb7ff" stroke-width="3"/><use href="#fist" x="118" y="50" width="116" height="116" color="#b9dcff"/><text x="176" y="213" text-anchor="middle" fill="#f3e9c8" font-family="Georgia,serif" font-size="22" font-weight="700">D · Revolution Ready</text><text x="176" y="243" text-anchor="middle" fill="#8da5b9" font-size="11">the people are ready to rise</text></g>
  <g transform="translate(806 150)"><rect width="352" height="292" rx="18" fill="url(#panel)" stroke="#315970" stroke-width="2"/><circle cx="176" cy="108" r="73" fill="url(#ib)" stroke="#7eb7ff" stroke-width="3"/><use href="#people" x="118" y="50" width="116" height="116" color="#b9dcff"/><text x="176" y="213" text-anchor="middle" fill="#f3e9c8" font-family="Georgia,serif" font-size="22" font-weight="700">E · Mobilized</text><text x="176" y="243" text-anchor="middle" fill="#8da5b9" font-size="11">the declared ranks stand ready</text></g>
 </g>

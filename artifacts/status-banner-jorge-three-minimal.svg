 <rect width="1200" height="570" fill="url(#bg)"/><rect width="1200" height="570" fill="url(#g)"/>
 <text x="55" y="58" fill="#f4df92" font-family="Georgia,serif" font-size="27" font-weight="700" letter-spacing="4">JORGE · THREE NEW OPTIONS</text>
 <text x="55" y="89" fill="#91a8bb" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">MINIMAL SILHOUETTES · OWNER-SIDE BLUE · 26PX FIRST</text><line y1="116" x2="1200" y2="116" stroke="#dabb62" stroke-opacity=".18"/>
 <g filter="url(#s)" font-family="Arial,sans-serif">

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="t d">
 <title id="t">Three minimal Jorge status icon samples</title><desc id="d">Simple bugle, raised fist, and mobilized group icons in owner-side blue.</desc>
 <defs>

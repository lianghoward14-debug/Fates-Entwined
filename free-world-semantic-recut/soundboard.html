<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free World 482–512 Corrected Review</title>
<style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}body{margin:0;background:radial-gradient(circle at top,#334862,#090b12 58%);color:#f5f7ff}main{max-width:1160px;margin:auto;padding:38px 22px}h1{margin:0 0 8px;font-size:clamp(27px,5vw,45px)}p{margin:0 0 25px;color:#c3cada;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}button{min-height:106px;padding:14px;border:1px solid #50617d;border-radius:14px;background:linear-gradient(145deg,#293750,#171d2c);color:inherit;text-align:left;cursor:pointer}button.recut{border-color:#af8a4f}button:hover{border-color:#9eb3ff}button.playing{background:linear-gradient(145deg,#5875c8,#293e78)}b,.label,.meta{display:block}b{font-size:20px}.label{font-size:13px;margin-top:6px}.meta{font-size:12px;color:#aeb9ce;margin-top:7px}</style></head>
<body><main><h1>482–512 · conservative semantic recut</h1><p>Gold borders are recut phrases. The remaining numbered clips are the untouched originals. Cuts were made only where the independently transcribed Greek and an audible phrase transition agree.</p><section class="grid" id="board"></section></main>
<script>let audio,active;fetch('manifest.json?v=1').then(r=>r.json()).then(items=>{for(const item of items){const b=document.createElement('button');b.className=item.kind;b.innerHTML=`<b>${item.id}</b><span class="label">${item.label}</span><span class="meta">${item.duration?item.duration.toFixed(2)+' seconds':'original file'}</span>`;b.onclick=()=>{audio?.pause();active?.classList.remove('playing');audio=new Audio(item.file+'?v=1');active=b;b.classList.add('playing');audio.onended=()=>b.classList.remove('playing');audio.play()};document.querySelector('#board').append(b)}})</script></body></html>

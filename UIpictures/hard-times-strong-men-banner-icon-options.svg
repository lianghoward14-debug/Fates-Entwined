<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760">
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171521"/>
      <stop offset=".48" stop-color="#080912"/>
      <stop offset="1" stop-color="#020308"/>
    </linearGradient>
    <linearGradient id="slotBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#221624"/>
      <stop offset="1" stop-color="#070911"/>
    </linearGradient>
    <filter id="glowGold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .page{fill:#05070d}
      .title{font:700 24px Cinzel, Georgia, serif;fill:#f3d66a;letter-spacing:.09em;text-anchor:middle}
      .note{font:14px Georgia, serif;fill:#9aa8bd;text-anchor:middle}
      .banner{fill:url(#bannerBg);stroke:#dba64e;stroke-width:1.55}
      .corner{stroke:#ffeeb0;stroke-width:1;opacity:.46;stroke-linecap:round}
      .iconSlot{fill:url(#slotBg);stroke:#dba64e;stroke-width:1.2}
      .mark{fill:none;stroke:#f2d66f;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;filter:url(#glowGold)}
      .markThin{fill:none;stroke:#f2d66f;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .markFill{fill:#111720;stroke:#f2d66f;stroke-width:2.6;stroke-linejoin:round}
      .accentFill{fill:#a9362d;stroke:#f2d66f;stroke-width:2.2;stroke-linejoin:round}
      .copy{font:800 16px Cinzel, Georgia, serif;fill:#f2d66f;letter-spacing:.025em}
      .sub{font:12px Georgia, serif;fill:#b8c3d4}
      .num{font:700 11px Cinzel, Georgia, serif;fill:#8bd7ff;letter-spacing:.09em}
    </style>
  </defs>

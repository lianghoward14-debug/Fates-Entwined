# fly.toml app configuration file generated for fates-entwined-main on 2026-05-19T23:10:06+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fates-entwined-main'
primary_region = 'lax'

[build]

[processes]
  app = 'node server/authoritative-v3/phase7-beta-server.mjs'

[env]
  FATE_SERVER_AUTHORITATIVE_V3_PHASE7_BETA_ENABLED = '1'
  FATE_SERVER_AUTHORITATIVE_V3_ENABLED = '0'
  FATE_SERVER_AUTHORITATIVE_V3_SHADOW_ENABLED = '0'
  FATE_AUTHORITY_V3_PHASE7_CLIENT_VERSION = '1.39.0-phase7-beta.1'
  FATE_AUTHORITY_V3_PHASE7_BUILD_ID = 'phase7-b29656b76981b25278f0fb3091ee9c5b58b78bbee62e1ffea415b6fbd3c12360'
  FATE_AUTHORITY_V3_DATA_DIR = '/data/authority-v3-phase7'
  FATE_AUTHORITY_V3_FIREBASE_API_KEY = 'AIzaSyByhcqY0Y27hUkvcAtO3mflRwnQCWhv4Yc'
  FATE_AUTHORITY_V3_HOST = '0.0.0.0'
  FATE_AUTHORITY_V3_PORT = '8787'
  FATE_AI_LEARNING_ENABLED = '1'
  FATE_AI_TRAINING_MODE = 'scheduled'
  FATE_AI_TRAIN_INTERVAL_MS = '21600000'
  FATE_AI_TRAIN_MAX_MS = '30'
  FATE_AI_TRAIN_EPISODES = '96'
  FATE_AI_TRAIN_MAX_SAMPLES = '12000'
  FATE_AI_TRAIN_RETENTION_DAYS = '45'

[[mounts]]
  source = 'fate_authority_data'
  destination = '/data'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Matchmaking state is held in this authoritative process.  Keep one
  # machine live so a waiting player cannot lose their queue entry to an
  # idle shutdown before their opponent arrives.
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

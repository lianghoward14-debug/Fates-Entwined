# fly.toml app configuration file generated for fates-entwined-main on 2026-05-19T23:10:06+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fates-entwined-main'
primary_region = 'lax'

[build]

[processes]
  app = 'node server/fate-ws-authority.js'

[env]
  FATE_WS_DATA_DIR = '/data/fate-authority'
  FATE_WS_FLY_STORE = '1'
  FATE_WS_REQUIRE_FLY_STORE = '1'
  FATE_WS_REQUIRE_TOKEN = '1'
  FATE_WS_DISABLE_FIREBASE_RTDB = '1'
  FATE_RTDB_DISABLED = '1'
  FATE_WS_DURABLE_WRITES = 'off'
  FATE_WS_REQUIRE_DURABLE_WRITES = '0'
  FATE_WS_STATE_GATE = '1'
  FATE_WS_REDUCER_MODE = 'strict'

[[mounts]]
  source = 'fate_authority_data'
  destination = '/data'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

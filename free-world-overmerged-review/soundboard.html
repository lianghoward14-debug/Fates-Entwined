<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>474+ Split Review</title>
<style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}body{margin:0;background:radial-gradient(circle at top,#33405f,#090b12 55%);color:#f4f6ff}main{max-width:1100px;margin:auto;padding:40px 22px}h1{margin:0 0 8px;font-size:clamp(28px,5vw,46px)}p{margin:0 0 26px;color:#bcc4da}h2{margin:28px 0 10px;color:#d7def4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}button{min-height:96px;padding:15px;border:1px solid #4c587d;border-radius:14px;background:linear-gradient(145deg,#29324d,#171c2c);color:inherit;text-align:left;cursor:pointer}button:hover{border-color:#90a5ff}button.playing{background:linear-gradient(145deg,#5971c9,#293b78)}b{display:block;font-size:20px}span{color:#bdc5dc;font-size:12px}</style></head>
<body><main><h1>Over-merged clips · 474 onward</h1><p>Only suspicious source clips over 1.8 seconds are shown, divided at their strongest quiet boundaries.</p><div id="board"></div></main>
<script>
const sources={474:6,476:6,479:3,480:2,481:4,482:12,483:6,484:3,493:2,497:2,498:4,501:3,512:8,563:2,586:3};
const board=document.querySelector('#board');let audio,active;
Object.entries(sources).forEach(([source,count])=>{const heading=document.createElement('h2');heading.textContent=`Original clip ${source}`;const grid=document.createElement('section');grid.className='grid';board.append(heading,grid);const parts=source==='476'?['01','02','03','04a','04b','05','06']:Array.from({length:count},(_,i)=>String(i+1).padStart(2,'0'));parts.forEach(part=>{const src=`clips/split-${source}-${part}.mp3?v=2`,button=document.createElement('button');button.innerHTML=`<b>${source} · part ${part.replace(/^0/,'')}</b><span>Loading duration…</span>`;const probe=new Audio(src);probe.preload='metadata';probe.onloadedmetadata=()=>button.querySelector('span').textContent=probe.duration.toFixed(3)+' seconds';button.onclick=()=>{audio?.pause();active?.classList.remove('playing');audio=new Audio(src);active=button;button.classList.add('playing');audio.onended=()=>button.classList.remove('playing');audio.play()};grid.append(button)})});
</script></body></html>

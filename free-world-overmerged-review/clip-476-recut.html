<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clip 476 Recut</title>
<style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#33405f,#090b12 60%);color:#f4f6ff}main{max-width:900px;margin:auto;padding:44px 22px}h1{margin:0 0 8px;font-size:clamp(30px,6vw,48px)}p{color:#bcc4da;margin:0 0 25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:13px}button{min-height:120px;padding:19px;border:1px solid #56658f;border-radius:16px;background:linear-gradient(145deg,#29324d,#171c2c);color:inherit;text-align:left;cursor:pointer}button.playing{background:linear-gradient(145deg,#5971c9,#293b78)}b{display:block;font-size:23px}span{color:#c2c9dc;font-size:13px}</style></head>
<body><main><h1>Clip 476 · fresh recut</h1><p>The old combined “part 4” is not present on this page. It is replaced by 4a and 4b.</p><section class="grid" id="board"></section></main>
<script>const parts=['01','02','03','04a','04b','05','06'],board=document.querySelector('#board');let audio,active;parts.forEach(part=>{const src=`clips/split-476-${part}.mp3?fresh=4763`,button=document.createElement('button');button.innerHTML=`<b>Part ${part.replace(/^0/,'')}</b><span>Loading duration…</span>`;const probe=new Audio(src);probe.preload='metadata';probe.onloadedmetadata=()=>button.querySelector('span').textContent=probe.duration.toFixed(3)+' seconds';button.onclick=()=>{audio?.pause();active?.classList.remove('playing');audio=new Audio(src);active=button;button.classList.add('playing');audio.onended=()=>button.classList.remove('playing');audio.play()};board.append(button)});</script></body></html>
